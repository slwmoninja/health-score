<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a78d6">
<title>Health Score</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232a78d6'/%3E%3Cpath d='M20 55 L38 55 L45 40 L55 68 L62 50 L80 50' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --surface:#fcfcfb;--page:#f9f9f7;--text:#0b0b0b;--text2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);
  --blue:#2a78d6;--aqua:#1baf7a;--yellow:#eda100;--green:#008300;--violet:#4a3aa7;--red:#e34948;--magenta:#e87ba4;--orange:#eb6834;--brown:#8b5a2b;--gold:#d4a017;--deepred:#8b1a1a;
  --good:#0ca30c;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;
  --radius:14px;--shadow:0 2px 10px rgba(0,0,0,.08);
  --btn-hi:rgba(255,255,255,.35);--btn-lo:rgba(11,11,11,.22);
}
@media (prefers-color-scheme: dark){
  :root{
    --surface:#1a1a19;--page:#0d0d0d;--text:#ffffff;--text2:#c3c2b7;--muted:#898781;
    --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
    --blue:#3987e5;--aqua:#199e70;--yellow:#c98500;--green:#008300;--violet:#9085e9;--red:#e66767;--magenta:#d55181;--orange:#d95926;--brown:#c9905c;--gold:#e0b12e;--deepred:#a83232;
    --btn-hi:rgba(255,255,255,.12);--btn-lo:rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100vh;}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--page);color:var(--text);
  max-width:480px;margin:0 auto;position:relative;padding-bottom:76px;}
h1,h2,h3{font-weight:700;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
.hidden{display:none !important;}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:20;background:var(--page);display:flex;align-items:center;
  justify-content:space-between;padding:14px 16px 10px;}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:.01em;
  text-shadow:0 -1px 0 var(--btn-hi), 0 1px 1px var(--btn-lo);}
.iconbtn{width:36px;height:36px;border-radius:10px;border:none;background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--text2);
  box-shadow:0 2px 0 var(--btn-lo), inset 0 1px 0 var(--btn-hi), var(--shadow);
  transition:transform .08s, box-shadow .08s;}
.iconbtn:active{transform:translateY(1px);box-shadow:0 0 0 var(--btn-lo), inset 0 1px 0 var(--btn-hi);}
.iconbtn svg{width:18px;height:18px;}

/* ---- screens ---- */
.screen{padding:4px 16px 12px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card h3{font-size:14px;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;}
.card-head h3{margin-bottom:0;}
.card + .card{margin-top:0;}
summary.card-summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;user-select:none;}
summary.card-summary::-webkit-details-marker{display:none;}
summary.card-summary .card-head{flex:1;margin-bottom:0;}
summary.card-summary h3{margin-bottom:0;}
summary.card-summary .chevron{color:var(--muted);font-size:12px;flex:none;margin-left:10px;transition:transform .15s ease;}
details.card[open] > summary.card-summary{margin-bottom:12px;}
details.card[open] > summary.card-summary .chevron{transform:rotate(180deg);}
/* ---- nested foldable section within a card (e.g. Settings > Data's sub-sections) —
   lighter than a full .card: no background/shadow of its own, just a divider from
   the section above, since it's already inside one. ---- */
details.subcard{border-top:1px solid var(--grid);padding-top:14px;margin-top:16px;}
details.subcard:first-of-type{border-top:none;padding-top:0;margin-top:0;}
details.subcard[open] > summary.subcard-summary{margin-bottom:12px;}
details.subcard[open] > summary.subcard-summary .chevron{transform:rotate(180deg);}
summary.subcard-summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;user-select:none;font-weight:600;}
summary.subcard-summary::-webkit-details-marker{display:none;}
summary.subcard-summary .chevron{color:var(--muted);font-size:12px;flex:none;margin-left:10px;transition:transform .15s ease;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.muted{color:var(--muted);font-size:12.5px;}

/* ---- pull-to-refresh (forces an update check on demand) ---- */
.pull-refresh{position:fixed;top:10px;left:50%;transform:translate(-50%,-60px);
  width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--text2);z-index:80;}
.pull-refresh.hidden{display:none;}
.pull-refresh.dragging{transition:none;}
.pull-refresh:not(.dragging){transition:transform .2s ease, opacity .2s ease;}
.pull-refresh .arrow{transition:transform .15s ease;line-height:1;}
.pull-refresh.ready .arrow{transform:rotate(180deg);}
.pull-refresh.spinning .arrow{display:none;}
.pull-refresh.spinning::after{content:'';width:16px;height:16px;border-radius:50%;
  border:2px solid var(--border);border-top-color:var(--blue);animation:pr-spin .7s linear infinite;}
@keyframes pr-spin{to{transform:rotate(360deg);}}
.text2{color:var(--text2);}

/* ---- info (tap-to-explain) ---- */
.info-btn{width:22px;height:22px;border-radius:50%;border:none;flex:none;
  background:var(--page);color:var(--muted);font-size:12px;font-weight:800;font-style:italic;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 0 var(--btn-lo), inset 0 1px 0 var(--btn-hi);}
.info-btn:active{transform:translateY(1px);box-shadow:none;}
.info-btn.warn{background:var(--serious);color:#fff;font-style:normal;}

/* ---- overall score ring ---- */
.score-hero{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px;}
.ring-wrap{position:relative;width:158px;height:158px;border-radius:50%;
  background:var(--surface);
  box-shadow:0 4px 0 var(--btn-lo), inset 0 2px 2px rgba(255,255,255,.4), inset 0 -3px 5px rgba(0,0,0,.1), 0 6px 12px rgba(0,0,0,.14);}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-label .num{font-size:38px;font-weight:800;line-height:1;}
.ring-label .lbl{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.04em;text-transform:uppercase;}

/* ---- bars ---- */
.chart{width:100%;}
.chart svg{width:100%;height:auto;display:block;overflow:visible;}
.bar-label{font-size:11px;fill:var(--text2);}
.bar-value{font-size:12px;font-weight:700;fill:var(--text);}
.axis-line{stroke:var(--axis);stroke-width:1;}
.goal-line{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 3;}
.legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
.swatch{width:10px;height:10px;border-radius:3px;flex:none;}

/* ---- badges / feedback ---- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:99px;}
.badge.good{color:var(--good);background:rgba(12,163,12,.10);}
.badge.focus{color:var(--serious);background:rgba(236,131,90,.14);}
.feedback-item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--grid);}
.feedback-item:first-child{border-top:none;}
.feedback-item .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;}

/* ---- lists / logs ---- */
.food-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--grid);}
.food-row:first-child{border-top:none;}
.food-row .name{font-size:14px;font-weight:600;}
.food-row .sub{font-size:12px;color:var(--muted);}
.food-row .kcal{font-size:14px;font-weight:700;text-align:right;}
.food-row .del{background:none;border:none;color:var(--muted);font-size:18px;padding:4px 8px;}
/* ---- generic list row (routines, custom exercises, workout history) ---- */
.list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--grid);gap:10px;}
.list-row:first-child{border-top:none;}
.list-row .name{font-size:14px;font-weight:600;}
.list-row .sub{font-size:12px;color:var(--muted);}
.del{background:none;border:none;color:var(--muted);font-size:18px;padding:4px 8px;flex:none;}
/* ---- compact exercise tables (routine builder targets, live-session rows) ---- */
.set-table-head{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--grid);padding-bottom:6px;margin-bottom:4px;}
.set-table-head span{text-align:center;}
.set-table-row{display:flex;align-items:center;gap:6px;padding:4px 0;}
.set-table-row input{width:100%;padding:7px 2px;text-align:center;border-radius:8px;border:1px solid var(--border);
  background:var(--page);color:var(--text);font-size:13.5px;}
.set-check{height:30px;border-radius:8px;border:1px solid var(--border);background:var(--page);
  color:var(--muted);font-size:14px;font-weight:700;padding:0;}
.set-check.checked{background:var(--good);color:#fff;border-color:var(--good);}
/* ---- routine tiles (Activity screen) — compact so several fit on screen ---- */
.routine-tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.routine-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;box-shadow:var(--shadow);position:relative;transition:box-shadow .15s, opacity .15s;}
.routine-tile-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.routine-tile-head h4{margin:0;font-size:14px;font-weight:700;color:var(--text);flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.routine-tile .sub{font-size:11px;color:var(--muted);display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.routine-go-btn{flex:0 0 auto;border:none;border-radius:9px;min-width:30px;height:30px;padding:0 6px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--deepred) 100%, white 15%), var(--deepred));
  color:#fff;font-weight:800;font-size:10.5px;box-shadow:0 2px 0 var(--btn-lo), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .08s, box-shadow .08s;}
.routine-go-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--btn-lo);}
.routine-delete-btn{position:absolute;top:4px;right:6px;border:none;background:none;color:var(--muted);
  font-size:17px;line-height:1;padding:4px 6px;border-radius:6px;}
.routine-delete-btn:active{color:var(--critical);}
/* Reactive "picked up" feedback the instant a press starts anywhere on the
   card, and a "landing here" highlight on whichever tile is currently under
   the finger during a drag — applied as direct style/class changes during
   the gesture (see the ROUTINE TILE REORDER script), not via render(), so
   the interaction stays smooth. */
.routine-tile.dragging{box-shadow:0 10px 24px rgba(0,0,0,.35);z-index:5;opacity:.96;}
.routine-tile.drop-target{outline:2px dashed var(--blue);outline-offset:2px;}

/* ---- forms ---- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:600;}
.field input[type=text],.field input[type=number],.field select{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--page);color:var(--text);font-size:15px;}
.input-clear-wrap{position:relative;}
.input-clear-wrap input{padding-right:36px;}
.input-clear-btn{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:30px;height:30px;
  border:none;background:none;color:var(--muted);font-size:20px;line-height:1;border-radius:50%;
  display:flex;align-items:center;justify-content:center;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
/* ---- Profile Preferences runs many small fields in a short card, so it gets
   its own tighter rhythm instead of the app-wide .field spacing ---- */
.profile-card .field{margin-bottom:10px;}
.profile-card .field label{margin-bottom:4px;font-size:11.5px;}
.profile-card .field-row{gap:8px;}
.profile-card .field input[type=number],.profile-card .field select{padding:9px 8px;font-size:14px;}
.seg{display:flex;background:var(--page);border-radius:10px;padding:3px;border:1px solid var(--border);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.1);}
.day-checks{display:flex;gap:6px;}
.daycheck{position:relative;flex:1;height:38px;}
.daycheck input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;}
.daycheck span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  border-radius:10px;background:var(--page);border:1px solid var(--border);
  font-size:13px;font-weight:700;color:var(--muted);transition:background .12s,color .12s,border-color .12s;}
.daycheck input:checked + span{background:var(--blue);color:#fff;border-color:var(--blue);}
/* ---- compact inline variant (Settings > Profile Preferences' "Days to track"
   row) — small enough to sit next to its own heading on one line instead of
   stacking below a full-width label ---- */
.day-checks.compact{gap:4px;}
.day-checks.compact .daycheck{flex:none;width:25px;height:25px;}
.day-checks.compact .daycheck span{font-size:10.5px;border-radius:7px;}
.seg button{flex:1;border:none;background:none;padding:9px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2);
  transition:transform .08s;}
.seg button.active{background:linear-gradient(180deg, color-mix(in srgb, var(--blue) 100%, white 12%), var(--blue));
  color:#fff;box-shadow:0 2px 0 var(--btn-lo), inset 0 1px 0 rgba(255,255,255,.4);}
.seg button.active:active{transform:translateY(1px);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);}
.btn-primary{width:100%;padding:13px;border:none;border-radius:11px;color:#fff;font-size:15px;font-weight:700;
  background:linear-gradient(180deg, color-mix(in srgb, var(--blue) 100%, white 15%), var(--blue));
  box-shadow:0 3px 0 var(--btn-lo), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .08s, box-shadow .08s;}
.btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-lo), inset 0 1px 0 rgba(255,255,255,.3);}

/* ---- topbar Install button — deliberately loud (var(--good) green, not the
   everyday blue) so it reads as a call to action next to the heading, on
   every screen, until installed ---- */
.topbar-install-btn{flex-shrink:0;border:none;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;
  color:#fff;background:linear-gradient(180deg, color-mix(in srgb, var(--good) 100%, white 15%), var(--good));
  box-shadow:0 2px 0 var(--btn-lo), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .08s, box-shadow .08s;}
.topbar-install-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--btn-lo);}
.topbar-install-btn.installed{background:var(--surface);color:var(--muted);border:1px solid var(--border);
  box-shadow:none;font-weight:600;}
/* ---- topbar "workout in progress" banner — shown on every screen except the
   Activity log itself (where the full session card already covers this), so
   start/pause/stop stays reachable "at any time" without a dedicated nav tab ---- */
.workout-banner-btn{flex-shrink:0;border:none;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;
  color:#fff;background:linear-gradient(180deg, color-mix(in srgb, var(--critical) 100%, white 15%), var(--critical));
  box-shadow:0 2px 0 var(--btn-lo), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .08s, box-shadow .08s;}
.workout-banner-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--btn-lo);}
/* "New Routine" specifically — a deep red, distinct from both the banner's
   usual bright/urgent red (that stays reserved for the "workout in progress"
   banner's own meaning) and the app's other red accents. */
.workout-banner-btn.deepred{background:linear-gradient(180deg, color-mix(in srgb, var(--deepred) 100%, white 15%), var(--deepred));}
.btn-secondary{width:100%;padding:13px;border:1px solid var(--border);border-radius:11px;background:var(--surface);
  color:var(--text);font-size:15px;font-weight:600;
  box-shadow:0 3px 0 var(--btn-lo), inset 0 1px 0 var(--btn-hi);
  transition:transform .08s, box-shadow .08s;}
.btn-secondary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-lo);}
.btn-primary:disabled{opacity:.5;}
.search-list{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-top:8px;}
.search-item{padding:10px 12px;border-top:1px solid var(--grid);font-size:14px;}
.search-item:first-child{border-top:none;}
.search-item .n{font-weight:600;}
.search-item .m{font-size:11.5px;color:var(--muted);}
/* exercise-search thumbnail slot — see exerciseThumbHtml */
.exercise-thumb{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.02em;}

/* ---- modal ---- */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.modal-backdrop.center{align-items:center;padding:16px;}
.modal{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:22px 20px 26px;
  max-height:88vh;overflow-y:auto;}
.modal-backdrop.center .modal{border-radius:18px;max-height:85vh;}
.modal h2{font-size:19px;margin-bottom:4px;}
.modal .sub{font-size:13px;color:var(--muted);margin-bottom:18px;}

/* ---- bottom nav ---- */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:20;}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;
  border:none;background:none;color:var(--muted);font-size:10.5px;font-weight:600;transition:transform .08s;}
.navbtn svg{width:21px;height:21px;transition:transform .12s;}
.navbtn.active{color:var(--blue);}
.navbtn.active svg{transform:translateY(-2px);filter:drop-shadow(0 2px 0 var(--btn-lo));}
.navbtn:active{transform:scale(.92);}

/* ---- week strip ---- */
.weekstrip{display:flex;gap:6px;margin-bottom:14px;}
.daychip{flex:1;text-align:center;padding:8px 2px;border-radius:10px;background:var(--surface);
  border:1px solid var(--border);}
.daychip .d{font-size:10px;color:var(--muted);}
.daychip .v{font-size:13px;font-weight:700;margin-top:3px;}
.daychip.today{border-color:var(--blue);}
.daychip.future{opacity:.35;}

/* ---- chart tooltip ---- */
#chart-tooltip{position:fixed;z-index:60;background:var(--text);color:var(--page);font-size:12px;font-weight:600;
  padding:6px 10px;border-radius:8px;pointer-events:none;transform:translate(-50%,-120%);white-space:nowrap;
  box-shadow:0 4px 10px rgba(0,0,0,.25);}
.chart-mark{cursor:pointer;}

/* ---- toast (silent backup save/restore feedback — never blocks input) ---- */
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,12px);max-width:calc(100% - 32px);
  background:var(--text);color:var(--page);font-size:13px;font-weight:600;text-align:center;
  padding:10px 16px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.3);
  z-index:70;pointer-events:none;opacity:0;transition:opacity .2s ease, transform .2s ease;}
#toast.show{opacity:1;transform:translate(-50%,0);}
#toast.toast-good{background:var(--good);color:#fff;}
#toast.toast-critical{background:var(--critical);color:#fff;}

/* ---- dashboard toggle rows (Settings) ---- */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--grid);}
.toggle-row:first-child{border-top:none;}
.toggle-row span{font-size:14px;font-weight:600;}
/* ---- two toggles sharing one row (Settings > Profile Preferences), instead of
   each getting its own full-width row ---- */
.toggle-row-split{justify-content:flex-start;gap:28px;}
.toggle-item{display:flex;align-items:center;gap:8px;}
.toggle-item span{font-size:14px;font-weight:600;}
.switch{width:42px;height:25px;border-radius:99px;border:none;background:var(--grid);position:relative;flex:none;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.15);transition:background .15s;}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s;}
.switch.on{background:var(--blue);}

/* ---- progress rows (totals infographic) ---- */

.prog-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}

.prog-fill{height:100%;border-radius:99px;transition:width .3s;}

/* ---- inline stat (This Week/Month score, shown next to the card title) ---- */
.card-head .inline-stat{font-size:14px;font-weight:700;white-space:nowrap;}
.card-head .inline-stat .muted{font-weight:500;}

/* ---- score trio (Total/Activity/Nutrition circles, one infographic) ---- */
/* Tight dashboard-gauge cluster now that there's no label text needing spread-out
   room — shrink-wraps to its content and centers as one group. Still wraps on
   very narrow phone screens instead of squeezing, via flex-wrap. */
.score-trio{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;}
.score-circle-col{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}

/* ---- collapsible section header ---- */
.section-toggle{display:flex;align-items:center;gap:6px;flex:1;cursor:pointer;}

.chevron{width:16px;height:16px;color:var(--muted);flex:none;transition:transform .15s;}
.chevron.open{transform:rotate(180deg);}
.quick-add{width:26px;height:26px;border-radius:50%;border:none;background:var(--good);color:#fff;
  font-size:17px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;flex:none;
  margin-right:8px;box-shadow:0 2px 0 var(--btn-lo), inset 0 1px 0 rgba(255,255,255,.4);}
.quick-add:active{transform:translateY(1px);box-shadow:none;}
.quick-add.red{background:var(--critical);}

/* ---- quick-log pill row (always visible, no tap-to-discover) ---- */
.pill-row{display:flex;gap:10px;margin-bottom:14px;}
.pill-btn{border:none;border-radius:11px;color:#fff;font-weight:700;font-size:14.5px;padding:13px;
  display:flex;align-items:center;justify-content:center;gap:6px;

<body>

<div class="pull-refresh hidden" id="pull-refresh"><span class="arrow">↓</span></div>
<div id="app"></div>
<div id="chart-tooltip" class="hidden"></div>

<div class="bottomnav" id="bottomnav">

<script>
'use strict';

/* =========================================================
   STATE
   ========================================================= */
const STORE_KEY = 'healthscore_v1';
// Human-readable build marker, shown in Settings > About — bump this on every
// change from here on so a reload can be visually confirmed against what was
// actually deployed (distinct from STORE_KEY, which is the data schema key
// and unrelated to app code version).
const APP_VERSION = '1.4.10';

function defaultState(){
  return {
    profile: null, // {age, sex, heightIn, weightLb, goalType, ratePerWeekLb, stepGoal, activeMinGoal}
    days: {},      // 'YYYY-MM-DD' -> {weightLb, foods:[...], activity:{steps,activeMin,kcal,source}, workouts:[...]}
    myFoods: [],
    foodMemory: {}, // { foodName: {qty, unitLabel} } — last quantity used, recalled next time
    myExercises: [],    // user/import-added custom exercises — mirrors myFoods
    exerciseMemory: {}, // { exerciseId: {weightLb, reps, durationSec, distanceMi, ts} } — mirrors foodMemory
    routines: [],        // named templates: "Leg day", "Cardio", etc. — see EXERCISE_DB/allExercises()
    activeWorkoutSession: null, // the single in-progress/paused session, or null — see startWorkoutSession()
    recentQuickStartTypes: [], // last 5 Quick Start activity types, most-recent-first — see recordQuickStartType()
    settings: {
      clientId:'', clientSecret:'', fdcApiKey:'', useMetric:false,
      charts: { projection:true },
      weightTrackingEnabled: true,
      // Set once the native install prompt resolves "accepted" (see
      // isInstalled()) — a regular browser tab that just walked through
      // installing doesn't itself switch to display-mode:standalone, so
      // that check alone would keep showing "Install" until the user
      // actually relaunches from the Home Screen icon. This remembers it
      // across reloads of the SAME tab in the meantime.
      installPromptAccepted: false
    },
    googleHealth: { accessToken:null, refreshToken:null, expiresAt:0, lastSyncAt:null, email:null },
    errorLog: [], // [{ts, message}] — last few sync errors, newest first, so silent auto-sync failures are still visible
    pendingCelebration: false // a goal was hit but confetti hasn't played yet — shown on the next fresh page load
  };
}

let state = loadState();

// Profiles saved before the "days to track" feature existed have no trackedDays
// field — default them to every day on, matching a brand-new onboarding's default.
// Profiles saved before "startedAt" existed likewise get backfilled, from the
// earliest logged day if there is one (otherwise today) — see isWithinFirstWeek().
function normalizeProfile(profile, days){
  if(profile && !profile.trackedDays) profile.trackedDays = [true,true,true,true,true,true,true];
  if(profile && !profile.startedAt){
    const dayKeys = days ? Object.keys(days).sort() : [];
    profile.startedAt = dayKeys.length ? dayKeys[0] : today();
  }
  return profile;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultState(), parsed);
    merged.settings = Object.assign(defaultState().settings, parsed.settings);
    merged.settings.charts = Object.assign(defaultState().settings.charts, parsed.settings && parsed.settings.charts);
    normalizeProfile(merged.profile, merged.days);
    return merged;
  }catch(e){ return defaultState(); }
}
let saveWarnedOnce = false;
function saveState(){
  try{
    // This one line IS the app's single save file, in exactly the sense a
    // native app has one: one key, always overwritten in place, never a
    // growing pile of dated files — see the big comment above
    // runAutoBackupDownload() for why the separate Downloads-folder export
    // doesn't/can't work the same way and is opt-in only.
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){
    // Don't call logError() here — it calls saveState() itself, which would recurse
    // if storage is genuinely broken. Record in-memory only and surface it once.
    console.error('Save failed:', e);
    state.errorLog.unshift({ts:Date.now(), message:'Save failed: '+e.message+' — your data may not be persisting.'});
    state.errorLog = state.errorLog.slice(0,3);
    if(!saveWarnedOnce){
      saveWarnedOnce = true;
      alert('Could not save your data (storage error: '+e.message+'). If this is a private/incognito browser tab, switch to a normal tab — private tabs often block or wipe local storage.');
    }
  }
}
// TESTING-ONLY convenience for the 2-tester phase: clearing browser history on
// a phone wipes localStorage the same as a fresh visit — no client-side
// technique can survive that intentionally, since that's what the browser
// feature is for. The app's actual single save file is the one localStorage
// key written in saveState() above — that already behaves exactly like a
// native app's private save (one record, silently overwritten in place,
// never visible as a pile of files), and is now hardened against the other
// realistic threat (silent eviction under storage pressure, not a deliberate
// clear) by the manifest/service-worker install path and the verified
// navigator.storage.persist() request further down.
//
// This function is what THAT can't cover: a visible, exportable copy in
// Downloads/Files for the one thing no web API can survive — the user
// deliberately clearing history/site data. Unlike the primary save, this
// one genuinely can't be a native-app-style single overwritten file on most
// browsers: a fixed filename hits a hard on-device-confirmed "file already
// exists" error on the second write (not a silent rename), and the API that
// *can* truly overwrite in place — File System Access — is confirmed absent
// on iOS Safari and this app's actual Android Chrome target. Where that API
// IS available (desktop Chrome/Edge), getWritableBackupHandle() below does
// use it for a real single overwritten file; everywhere else this falls back
// to a new timestamped file each time it's invoked.
//
// That's exactly why this is manual-only now, called ONLY from the explicit
// "Back up now" tap in Settings' Data card — never automatically from
// saveState() or on backgrounding. Automatically re-downloading every few
// minutes/hours was the actual source of "many save files" piling up in
// Downloads (each one also firing the browser's own unsuppressable "Download
// complete" notification, same as alert()/confirm() — no page can silence
// that, it's deliberate so a site can never silently drop files on a
// device). With the primary save already hardened above, there's no need for
// this export to run on its own — it's an on-demand snapshot, the same way
// "Export" works in most native apps, not a second automatic save path.
//
// Flip this off / replace it before a production rollout and evaluate a real
// solution then (e.g. cloud-backed sync, which trades this privacy property
// for true zero-touch restore) — this is a testing-phase shortcut, not
// something to ship broadly.

// Minimal IndexedDB wrapper for the one thing it's used for: persisting a
// FileSystemFileHandle across page loads so the single-file-overwrite path
// below can reuse the same on-disk file without re-prompting every time.
// (A handle isn't JSON-serializable, so it can't live in localStorage/state
// like everything else — IndexedDB is the only storage that can hold one.)
const BACKUP_HANDLE_DB = 'health-score-fs', BACKUP_HANDLE_STORE = 'handles', BACKUP_HANDLE_KEY = 'backupFile';
function openHandleDb(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(BACKUP_HANDLE_DB, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(BACKUP_HANDLE_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function loadSavedBackupHandle(){
  try{
    const db = await openHandleDb();
    return await new Promise((resolve, reject)=>{
      const req = db.transaction(BACKUP_HANDLE_STORE, 'readonly').objectStore(BACKUP_HANDLE_STORE).get(BACKUP_HANDLE_KEY);
      req.onsuccess = ()=>resolve(req.result||null);
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function saveBackupHandle(handle){
  try{
    const db = await openHandleDb();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(BACKUP_HANDLE_STORE, 'readwrite');
      tx.objectStore(BACKUP_HANDLE_STORE).put(handle, BACKUP_HANDLE_KEY);
      tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ /* best-effort */ }
}
// On browsers with the File System Access API (desktop Chrome/Edge; per the
// note further up, confirmed absent on iOS Safari and this app's actual
// Android Chrome target as of that testing — kept here as progressive
// enhancement in case that ever changes, and free on the browsers where it's
// already true), this lets the backup overwrite the SAME on-disk file every
// time instead of creating a new timestamped one — the real single-save-file
// behavior, for the export path, on the browsers that can actually do it.
// Every call now comes from the explicit "Back up now" tap (a genuine,
// dedicated gesture for this), so it's always allowed to pop the one-time
// "choose where to save" picker the first time; a saved, already-granted
// handle is reused silently on every call after that.
async function getWritableBackupHandle(){
  if(!window.showSaveFilePicker) return null;
  try{
    let handle = await loadSavedBackupHandle();
    if(handle){
      const perm = await handle.queryPermission({mode:'readwrite'});
      if(perm==='granted') return handle;
      const req = await handle.requestPermission({mode:'readwrite'});
      if(req==='granted') return handle;
      return null; // permission denied
    }
    handle = await window.showSaveFilePicker({
      suggestedName: 'health-score-data.json',
      types: [{description:'Health Score backup', accept:{'application/json':['.json']}}]
    });
    await saveBackupHandle(handle);
    return handle;
  }catch(e){
    return null; // user cancelled the picker, or any other failure — caller falls back
  }
}
// Manual/on-demand only — see the big comment above for why this isn't
// called automatically from saveState() or on backgrounding anymore.
async function runAutoBackupDownload(){
  if(!state.profile) return;
  const json = JSON.stringify(state);

  const handle = await getWritableBackupHandle();
  if(handle){
    try{
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      return;
    }catch(e){ /* fall through to the timestamped-download fallback below */ }
  }
  try{
    const blob = new Blob([json], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    // Timestamped, not a fixed name — a fixed name hit a hard "file already
    // exists" error on-device rather than a silent auto-rename, on the
    // browsers that land here (no File System Access API, or no granted
    // handle yet).
    const stamp = new Date().toISOString().replace(/[:.]/g,'-');
    a.download = `health-score-data-${stamp}.json`;
    a.click();
  }catch(e){ /* best-effort */ }
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Highlights a data point value (a score, a count, a gap) within the succinct
// Trends analysis bullets/tips, so the numbers driving each line stand out.
function hl(v){ return `<span style="color:var(--yellow);font-weight:700;">${v}</span>`; }
// Non-blocking, self-dismissing feedback for routine backup save/restore
// events — unlike alert(), it never freezes the page waiting for a tap, and
// pointer-events:none means it can't intercept a touch even while visible, so
// it can't get in the way of whatever the user does right after tapping
// Back up now / Restore / Import.
let toastTimer = null;
function showToast(message, tone){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.className = 'toast show' + (tone ? ' toast-'+tone : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.classList.remove('show'); }, 3200);
}
function logError(message){
  state.errorLog.unshift({ts: Date.now(), message});
  state.errorLog = state.errorLog.slice(0, 3);
  saveState();
}
// Backing logic for the onboarding "Restore latest backup" flow — see
// openBackupRestorePicker for how the file(s) get here.
async function importDataFromFile(file){
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || typeof parsed!=='object' || !('days' in parsed)) throw new Error('This file does not look like a Health Score export.');
    if(!confirm('This will replace all current data on this device with the contents of the imported file. Continue?')) return;
    state = Object.assign(defaultState(), parsed);
    state.settings = Object.assign(defaultState().settings, parsed.settings);
    state.settings.charts = Object.assign(defaultState().settings.charts, parsed.settings && parsed.settings.charts);
    normalizeProfile(state.profile, state.days);
    saveState();
    document.querySelectorAll('.modal-backdrop').forEach(m=>m.remove()); // close onboarding if open
    render();
    showToast('Data imported.', 'good');
  }catch(e){
    showToast('Could not import that file: '+e.message, 'critical');
  }
}
// Picks the newest Health Score backup out of one or more selected files, so
// restoring never requires the user to eyeball filenames/dates themselves —
// they can select their whole Downloads folder (or just multi-select a few
// files) and the right one gets found automatically. Matches this app's own
// timestamped filename (health-score-data-<ISO stamp>.json) first since the
// stamp sorts correctly as a string with no file reads needed; anything that
// doesn't match that pattern (e.g. a renamed file) falls back to the File
// object's own lastModified. Accepts both .json and .js extensions — the
// content is plain JSON text either way (importDataFromFile parses it the
// same regardless of extension), so a backup that landed in Downloads named
// or renamed with a .js extension is picked up exactly the same as a .json one.
function pickLatestBackupFile(files){
  const list = Array.from(files||[]).filter(f=>/\.(json|js)$/i.test(f.name));
  if(list.length===0) return null;
  const stampOf = f=>{
    const m = f.name.match(/health-score-data-(.+)\.(?:json|js)$/i);
    return m ? m[1] : null;
  };
  list.sort((a,b)=>{
    const sa = stampOf(a), sb = stampOf(b);
    if(sa && sb) return sa<sb ? 1 : sa>sb ? -1 : 0;
    if(sa && !sb) return -1;
    if(sb && !sa) return 1;
    return b.lastModified-a.lastModified;
  });
  return list[0];
}
function importLatestBackupFromFiles(files){
  const latest = pickLatestBackupFile(files);
  if(!latest){ if(files && files.length) showToast('No .json or .js backup file found in what you selected.', 'critical'); return; }
  importDataFromFile(latest);
}
// On browsers that support it (desktop Chrome/Edge; some Android Chrome
// versions), jumps the native picker straight into the Downloads folder and
// lets multiple files be selected in one go, so restoring is a single tap into
// Downloads rather than a manual navigate-and-guess-which-one. iOS Safari and
// older/other Android browsers don't expose this API at all — confirmed
// on-device, not just a feature-detection gap — so they fall back to the
// plain <input type=file multiple> picker, which still supports multi-select
// and still gets the newest one picked automatically once files are chosen.
// No browser exposes a way to read a file back into a page without some kind
// of user gesture/grant every single time (that's what makes "clear history"
// an effective wipe in the first place), so a manual tap here is unavoidable —
// this is about making that one tap as short as possible, not eliminating it.
async function openBackupRestorePicker(fallbackInputEl){
  if(window.showOpenFilePicker){
    try{
      const handles = await window.showOpenFilePicker({
        multiple: true,
        startIn: 'downloads',
        types: [{description:'Health Score backup', accept:{
          'application/json':['.json'],
          'text/javascript':['.js'],
          'application/javascript':['.js']
        }}]
      });
      const files = await Promise.all(handles.map(h=>h.getFile()));
      importLatestBackupFromFiles(files);
      return;
    }catch(e){
      if(e.name==='AbortError') return; // user backed out of the picker — don't chain into a second one
      // Any other failure — fall through to the plain file input below.
    }
  }
  fallbackInputEl.click();
}

function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function today(){ return isoDate(new Date()); }
function dateFromIso(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(iso, n){ const d=dateFromIso(iso); d.setDate(d.getDate()+n); return isoDate(d); }
function dayOfWeek(iso){ return dateFromIso(iso).getDay(); } // 0=Sun
function isSunday(iso){ return dayOfWeek(iso)===0; }

// Week runs Monday..Sunday. Returns {start, end} iso strings for the week containing iso.
function weekRange(iso){
  const dow = dayOfWeek(iso); // 0=Sun..6=Sat
  const mondayOffset = dow===0 ? -6 : 1-dow;
  const start = addDays(iso, mondayOffset);
  const end = addDays(start, 6);
  return {start, end};
}
function monthRange(iso){
  const d = dateFromIso(iso);
  const start = isoDate(new Date(d.getFullYear(), d.getMonth(), 1));
  const end = isoDate(new Date(d.getFullYear(), d.getMonth()+1, 0));
  return {start, end};
}
function datesBetween(startIso, endIso){
  const out=[]; let cur=startIso;
  while(cur<=endIso){ out.push(cur); cur=addDays(cur,1); }
  return out;
}
// A day only "counts" toward weekly/monthly scores, feedback, and nutrient totals
// if its day-of-week is checked in Profile's "Days to track". Untouched profiles
// (or none set yet) track every day, matching onboarding's all-checked default.
function isTrackedDay(iso){
  const td = state.profile && state.profile.trackedDays;
  return !td || td[dayOfWeek(iso)]!==false;
}
function trackedDatesBetween(startIso, endIso){
  return datesBetween(startIso, endIso).filter(isTrackedDay);
}
// Last logged weight within a date list, scanning from the end — shared by the
// Monthly Trends chart's month buckets and the month view's week-over-week comparison.
function latestWeightIn(dates){
  for(let i=dates.length-1;i>=0;i--){ const w=getDay(dates[i]).weightLb; if(w) return w; }
  return null;
}
// Same scan as latestWeightIn, but returns which date the value came from —
// lets the Monthly Trends table write a correction back to the right day
// instead of just the aggregated month value.
function latestWeightDateIn(dates){
  for(let i=dates.length-1;i>=0;i--){ if(getDay(dates[i]).weightLb) return dates[i]; }
  return null;
}
// True through the 7th day (inclusive) after profile.startedAt — the window in
// which a weight/profile correction still backfills onto that week's day logs
// via backfillFirstWeekWeight, since those early logs were seeded from (or
// meant to match) the original weight rather than being independent weigh-ins.
function isWithinFirstWeek(){
  return !!(state.profile && state.profile.startedAt && today() <= addDays(state.profile.startedAt, 6));
}
// Corrects the current week's day logs to match a just-edited weight, so History,
// the Trends chart, and CSV export don't keep showing the old (wrong) starting
// weight alongside the now-corrected profile. Only touches day entries that still
// hold the exact old value — a distinct real weigh-in logged that week is left alone.
function backfillFirstWeekWeight(oldWeight, newWeight){
  if(!state.profile || !state.profile.startedAt) return;
  if(oldWeight==null || newWeight==null || oldWeight===newWeight) return;
  for(let i=0;i<7;i++){
    const iso = addDays(state.profile.startedAt, i);
    if(iso>today()) break;
    const d = state.days[iso];
    if(d && d.weightLb===oldWeight) d.weightLb = newWeight;

const MONTH_LETTERS = 'JFMAMJJASOND';
// A calendar month's date range, capped at `today` so the current (in-progress)
// month doesn't pull in un-lived future days the way a plain monthRange() would.
function monthEndCapped(year, monthIdx){
  const last = isoDate(new Date(year, monthIdx+1, 0));
  const t = today();
  return last < t ? last : t;
}
// Trailing n calendar months ending with the month containing `endIso` (inclusive) —
// used for the Monthly Trends chart's rolling-year view, one point per month.
function trailingMonthBuckets(n, endIso){
  const d = dateFromIso(endIso);
  const buckets = [];
  for(let i=n-1;i>=0;i--){
    const bd = new Date(d.getFullYear(), d.getMonth()-i, 1);
    const year = bd.getFullYear(), monthIdx = bd.getMonth();
    buckets.push({start: isoDate(bd), end: monthEndCapped(year, monthIdx), year, monthIdx});
  }
  return buckets;
}
function getDay(iso){
  if(!state.days[iso]) state.days[iso] = {weightLb:null, foods:[], activity:{steps:0,activeMin:0,kcal:0,distanceMi:0,source:'manual'}, celebrated:{}};
  if(state.days[iso].activity.distanceMi===undefined) state.days[iso].activity.distanceMi = 0; // upgrade older saved days
  if(!state.days[iso].celebrated) state.days[iso].celebrated = {};
  if(!state.days[iso].workouts) state.days[iso].workouts = []; // upgrade older saved days
  return state.days[iso];
}
// Marks the first time (per day) steps, active minutes, or a perfect Total Score
// cross their goal — checked after every activity/food update. Deliberately does
// not cover Calories/Nutrition on its own. Doesn't fire the confetti itself: that's
// deferred to the next fresh page load (see the pendingCelebration check near
// startup) rather than popping up mid-interaction right as the goal is crossed.
function checkGoalsAndCelebrate(iso){
  const p = state.profile;
  const d = getDay(iso);
  let fired = false;
  if(p.stepGoal>0 && d.activity.steps>=p.stepGoal && !d.celebrated.steps){
    d.celebrated.steps = true; fired = true;
  }
  if(p.activeMinGoal>0 && effectiveActiveMin(iso)>=p.activeMinGoal && !d.celebrated.activeMin){
    d.celebrated.activeMin = true; fired = true;
  }
  const overall = dayOverallScore(iso);
  if(overall!==null && overall>=100 && !d.celebrated.totalScore){
    d.celebrated.totalScore = true; fired = true;
  }
  if(fired){ state.pendingCelebration = true; saveState(); }
}

/* =========================================================
   WORKOUT SESSION — start/pause/stop/save with automatic time
   tracking. Mirrors the app's existing convention for state that
   must survive reload/backgrounding (see googleHealth.expiresAt):
   an absolute timestamp persisted in state, re-derived on every
   read via Date.now(), rather than a live-counting JS variable
   that would be lost if the phone locks or the tab reloads mid-workout.
   ========================================================= */
function workoutDurationMs(session){
  // A finished session's duration is fixed at its own endTime — using
  // Date.now() here (as the running/paused branches correctly do) would make
  // an already-completed workout's "duration" keep growing every time this
  // is called long after the fact, which is exactly wrong for a saved record.
  if(session.status==='completed') return session.endTime - session.startTime - (session.pausedAccumMs||0);
  const end = session.status==='paused' ? session.pausedAt : Date.now();
  return end - session.startTime - (session.pausedAccumMs||0);
}
function formatElapsed(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  const mm = String(m).padStart(2,'0'), ss = String(s).padStart(2,'0');
  return h>0 ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
}
// Pre-populates each exercise with its planned number of set rows (target, or
// the last time's rep/weight values, or a plain default of 3) — matching
// Hevy's own "Log Workout" screen, where you check off/edit pre-filled rows
// rather than typing a fresh set from scratch each time. Unchecked rows are
// dropped when the session is finished (see finishWorkoutSession).
function plannedSetRows(re){
  const remembered = state.exerciseMemory[re.exerciseId];
  const template = exerciseById(re.exerciseId);
  // A pure-time exercise (Spinning, a duration/distance_duration type) has
  // no "sets" concept at all — one continuous entry, not the usual
  // multi-set default — so an incidental checkbox tick doesn't inflate the
  // session's Sets stat with sets the user never saw or chose.
  const count = usesSetsCount(template ? template.metricType : 'weight_reps') ? (re.targetSets || 3) : 1;
  const rows = [];
  for(let i=0;i<count;i++){
    rows.push({
      index:i, setType:'normal',
      weightLb: re.targetWeightLb!=null ? re.targetWeightLb : (remembered ? remembered.weightLb : null),
      reps: re.targetReps!=null ? re.targetReps : (remembered ? remembered.reps : null),
      distanceMi: re.targetDistanceMi!=null ? re.targetDistanceMi : (remembered ? remembered.distanceMi : null),
      durationSec: re.targetDurationSec!=null ? re.targetDurationSec : (remembered ? remembered.durationSec : null),
      rpe:null, completed:false
    });
  }
  return rows;
}
// freeformTitle names a Quick Start session (e.g. "Walking") when there's no
// routine — ignored if routine is set, since the routine's own name wins.
function startWorkoutSession(routine, freeformTitle){
  const exercises = routine ? routine.exercises.map((re,i)=>{
    const ex = exerciseById(re.exerciseId);
    return {id:Date.now()+Math.random()+i, exerciseId:re.exerciseId, exerciseTitle:ex?ex.name:'',
      supersetId:null, notes:re.notes||'', order:i, sets:plannedSetRows(re)};
  }) : [];
  state.activeWorkoutSession = {
    id: Date.now()+Math.random(),
    title: routine ? routine.name : (freeformTitle || 'Workout'),
    routineId: routine ? routine.id : null,
    startTime: Date.now(), endTime: null, description:'',
    status:'running', pausedAccumMs:0, pausedAt:null,
    caloriesBurnedOverride: null, // null = show the live auto-estimate; a number once the user edits it — see estimateWorkoutCalories
    exercises
  };
  saveState(); render();
}
function pauseWorkoutSession(){
  const s = state.activeWorkoutSession; if(!s || s.status!=='running') return;
  s.status='paused'; s.pausedAt=Date.now();
  saveState(); render();
}
function resumeWorkoutSession(){
  const s = state.activeWorkoutSession; if(!s || s.status!=='paused') return;
  s.pausedAccumMs += Date.now()-s.pausedAt; s.pausedAt=null; s.status='running';
  saveState(); render();
}
// discard=true drops the session entirely (e.g. started by mistake); otherwise
// finalizes it into getDay(iso).workouts, which is what makes it count toward
// the Activity goal (see effectiveActiveMin) and show up in history.
function finishWorkoutSession(discard){
  const s = state.activeWorkoutSession; if(!s) return;
  if(discard){ state.activeWorkoutSession=null; saveState(); render(); return; }
  if(s.status==='paused'){ s.pausedAccumMs += Date.now()-s.pausedAt; s.pausedAt=null; }
  s.endTime = Date.now(); s.status = 'completed';
  // Finalize whichever the user was actually looking at — their own typed
  // override if they edited it, otherwise the live auto-estimate — into the
  // permanent caloriesBurned field, then drop the live-only override field.
  s.caloriesBurned = s.caloriesBurnedOverride!=null ? s.caloriesBurnedOverride : estimateWorkoutCalories(s);
  delete s.caloriesBurnedOverride;
  // Drop any set rows never actually checked off — pre-populated planned rows
  // (see plannedSetRows) or an extra "+ Add Set" row left blank — so an
  // unfinished plan doesn't get recorded as if it happened; same for an
  // exercise added but never actually performed.
  s.exercises.forEach(ex=>{ ex.sets = ex.sets.filter(set=>set.completed); ex.sets.forEach((set,i)=>set.index=i); });
  s.exercises = s.exercises.filter(ex=>ex.sets.length>0);
  const iso = isoDate(new Date(s.startTime));
  getDay(iso).workouts.push(s);
  state.activeWorkoutSession = null;
  saveState(); render();
  checkGoalsAndCelebrate(iso);
}
// Logs a Quick Start session after the fact — no live timer was ever run, so
// startTime is simply backdated by the entered minutes. Otherwise identical
// to what finishWorkoutSession produces (same shape, same calorie estimate
// via estimateWorkoutCalories/metForSession), since a manually-timed session
// is a completed workout like any other, just never live.
function logQuickStartManualTime(type, minutes){
  const now = Date.now();
  const s = {
    id: now+Math.random(), title: type, routineId: null,
    startTime: now - minutes*60000, endTime: now, description:'',
    status:'completed', pausedAccumMs:0, exercises:[]
  };
  s.caloriesBurned = estimateWorkoutCalories(s);
  const iso = isoDate(new Date(s.startTime));
  getDay(iso).workouts.push(s);
  saveState(); render();
  checkGoalsAndCelebrate(iso);
}
function addExerciseToActiveSession(exerciseId){
  const s = state.activeWorkoutSession; if(!s) return;
  const ex = exerciseById(exerciseId); if(!ex) return;
  s.exercises.push({id:Date.now()+Math.random(), exerciseId, exerciseTitle:ex.name, supersetId:null, notes:'', order:s.exercises.length,
    sets:plannedSetRows({exerciseId, targetSets:1, targetReps:null, targetWeightLb:null, targetDurationSec:null, targetDistanceMi:null})});
  saveState(); render();
}
// Grows/shrinks an exercise's set count in place — plannedSetRows seeds every
// set with identical values, so growing just clones the last row's values
// (same as the old "+ Add Set" behavior) and shrinking truncates from the
// end. No render() — this only changes an off-screen array length (the
// compact row doesn't display individual sets), so nothing visible needs
// to update, same reasoning as updateExerciseField below.
function updateExerciseSetCount(sessionExerciseId, count){
  const s = state.activeWorkoutSession; if(!s) return;
  const ex = s.exercises.find(e=>e.id===sessionExerciseId); if(!ex) return;
  count = Math.max(0, Math.min(20, Math.round(Number(count))||0));
  const template = ex.sets[ex.sets.length-1] || {weightLb:null, reps:null, distanceMi:null, durationSec:null};
  while(ex.sets.length < count){
    ex.sets.push({index:ex.sets.length, setType:'normal', weightLb:template.weightLb, reps:template.reps,
      distanceMi:template.distanceMi, durationSec:template.durationSec, rpe:null, completed:false});
  }
  if(ex.sets.length > count) ex.sets.length = count;
  ex.sets.forEach((st,i)=>st.index=i);
  saveState();
}
// One compact row edits one exercise, not one set — an edit applies the same
// value to every one of that exercise's sets uniformly (they already start
// uniform, from plannedSetRows). Fired on every keystroke — deliberately
// does NOT render(), so typing doesn't fight focus loss (see the food-search
// input's own comment on that).
function updateExerciseField(sessionExerciseId, field, value){
  const s = state.activeWorkoutSession; if(!s) return;
  const ex = s.exercises.find(e=>e.id===sessionExerciseId); if(!ex) return;
  const v = (value===''||value==null) ? null : Number(value);
  ex.sets.forEach(set=>{ set[field] = v; });
  saveState();
}
// Checking an exercise is what "counts" it — marks every one of its sets
// complete at once (using their current, possibly-edited values), captures
// exerciseMemory (recalled as the default for this exercise's next planned
// row/session, same as selectFoodIntoForm recalls foodMemory), and is what
// finishWorkoutSession uses to decide which exercises actually happened.
// Toggles off (uncompletes all) if every set was already complete.
function toggleExerciseComplete(sessionExerciseId){
  const s = state.activeWorkoutSession; if(!s) return;
  const ex = s.exercises.find(e=>e.id===sessionExerciseId); if(!ex) return;
  const next = !(ex.sets.length>0 && ex.sets.every(set=>set.completed));
  ex.sets.forEach(set=>{ set.completed = next; });
  if(next && ex.sets[0]){
    const s0 = ex.sets[0];
    state.exerciseMemory[ex.exerciseId] = {weightLb:s0.weightLb, reps:s0.reps, durationSec:s0.durationSec, distanceMi:s0.distanceMi, ts:Date.now()};
  }
  saveState(); render();
}
function removeExerciseFromActiveSession(idx){
  const s = state.activeWorkoutSession; if(!s) return;
  s.exercises.splice(idx,1);
  s.exercises.forEach((ex,i)=>ex.order=i);
  saveState(); render();
}
function volumeLbForSession(s){
  let total = 0;
  s.exercises.forEach(ex=>ex.sets.forEach(set=>{
    if(set.completed && set.weightLb!=null && set.reps!=null) total += set.weightLb*set.reps;
  }));
  return Math.round(total);
}
function completedSetCountForSession(s){
  return s.exercises.reduce((sum,ex)=>sum+ex.sets.filter(set=>set.completed).length, 0);
}
// Codebase's first setInterval — deliberately scoped to a single textContent
// write, never triggering its own render(), since render() is a full innerHTML
// rebuild (see its own comment) and would be wasteful/input-focus-hostile at a
// 1Hz cadence. Armed/cleared once per render() call (see its own body) so it's
// always in sync with whichever screen is currently mounted.
let workoutTimerInterval = null;
function wireWorkoutTimer(){
  clearInterval(workoutTimerInterval); workoutTimerInterval = null;
  if(!state.activeWorkoutSession || state.activeWorkoutSession.status!=='running') return;
  workoutTimerInterval = setInterval(()=>{
    const el = document.getElementById('workout-elapsed');
    if(!el){ clearInterval(workoutTimerInterval); return; } // defensive: DOM was replaced without going through render()
    el.textContent = formatElapsed(workoutDurationMs(state.activeWorkoutSession));
  }, 1000);
}

/* =========================================================
   ROUTINE BUILDER — a self-contained modal (own draft state, own
   re-render loop scoped to its own wrapper element) following the
   onboarding modal-sequence pattern (wrap appended to document.body,
   its own handlers, wrap.remove() on close) rather than a new
   top-level screen — bounded/linear (name -> add exercises -> set
   targets -> save) fits a modal, unlike the live session below.
   ========================================================= */
// Mirrors recentFoods() exactly — sourced from exerciseMemory (last-used
// timestamp per exercise), so "Recent Exercises" reflects what's actually
// been logged, not just added to a routine.
function recentExercises(limit){
  return Object.entries(state.exerciseMemory)
    .sort((a,b)=>(b[1].ts||0)-(a[1].ts||0))
    .map(([id])=>exerciseById(id))
    .filter(Boolean)
    .slice(0, limit||5);
}
// Empty query shows Recent Exercises (matching Hevy's own "Add Exercise"
// screen default, and this app's existing food-search convention) instead of
// an empty list requiring the user to already know what to type.
function getExerciseResults(query){
  if(!query || !query.trim()) return recentExercises(8);
  const q = query.trim().toLowerCase();
  return allExercises().filter(e=>e.name.toLowerCase().includes(q)).slice(0,8);
}
// Small colored initials badge standing in for a real per-exercise
// illustration — those are proprietary to apps like Hevy and not something
// to reproduce; this is a deliberately simple, reliable substitute (no image
// assets to bundle or fetch) rather than a real per-exercise graphic.
const CATEGORY_BADGE = {
  'Chest':['CH','var(--red)'], 'Back':['BK','var(--blue)'], 'Shoulders':['SH','var(--violet)'],
  'Arms':['AR','var(--orange)'], 'Legs':['LG','var(--good)'], 'Core':['CO','var(--yellow)'],
  'Cardio':['CD','var(--magenta)'], 'Full Body':['FB','var(--aqua)'], 'Other':['?','var(--muted)']
};
function exerciseThumbHtml(category){
  const [label,color] = CATEGORY_BADGE[category] || CATEGORY_BADGE['Other'];
  return `<div class="exercise-thumb" style="background:${color};">${label}</div>`;
}
// Sets/reps/weight are opt-IN — shown only for exercise types that are
// clearly a weights/reps/sets activity (weight_reps, reps_only,
// weight_distance) — rather than opt-out, so a pure-time cardio type like
// Spinning (metricType 'duration' or 'distance_duration') never picks them
// up by accident. Shared by both the routine builder's targetFieldsForMetricType
// below and the live session's liveFieldsForExercise.
function usesSetsCount(mt){ return mt==='weight_reps'||mt==='reps_only'||mt==='weight_distance'; }
// Which target-KPI fields make sense for a given exercise's metricType — a UI
// hint only (see the EXERCISE_DB comment); setFieldsForMetricType (live
// session set table) mirrors this same field selection for actual set entry.
function targetFieldsForMetricType(mt){
  const fields = [];
  if(mt==='weight_reps'||mt==='reps_only') fields.push('targetReps');
  if(mt==='weight_reps'||mt==='weight_distance') fields.push('targetWeightLb');
  if(usesSetsCount(mt)) fields.push('targetSets');
  if(mt==='distance_duration'||mt==='weight_distance') fields.push('targetDistanceMi');
  return fields;
}
const TARGET_FIELD_LABELS = {targetSets:'SETS', targetReps:'REPS', targetWeightLb:'LBS', targetDistanceMi:'MI'};
const TARGET_FIELD_ORDER = ['targetSets','targetReps','targetWeightLb','targetDistanceMi'];
// Union of columns needed across every exercise currently in the draft, in
// one canonical order — lets a mixed-type routine (a lift plus a plank)
// share ONE header row instead of each exercise repeating its own field
// labels, which is what made the old per-exercise layout tall. Time is NOT
// part of this union — every exercise gets an optional time goal
// regardless of type (a lift can have a rest/time cap too), so its
// Min/Sec columns are always shown, appended separately below.
function routineTargetColumns(draft){
  const cols = new Set();
  draft.exercises.forEach(re=>{
    const ex = exerciseById(re.exerciseId);
    targetFieldsForMetricType(ex ? ex.metricType : 'weight_reps').forEach(f=>cols.add(f));
  });
  return TARGET_FIELD_ORDER.filter(f=>cols.has(f));
}
// Time goal is entered as separate Min/Sec fields (e.g. "1 min 30 sec")
// rather than a single unit-toggle field — simpler than a toggle control
// and it directly supports a combined value, not just whole minutes or
// whole seconds. Stored internally as one targetDurationSec (min*60+sec),
// matching every other duration field in the app.
function routineExerciseRowHtml(re, idx, ex, columns){
  const exFields = targetFieldsForMetricType(ex ? ex.metricType : 'weight_reps');
  const totalSec = re.targetDurationSec || 0;
  return `<div class="set-table-row">
    <span style="flex:1;min-width:0;text-align:left;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(ex?ex.name:re.exerciseId)}</span>
    ${columns.map(f=>{
      if(!exFields.includes(f)) return `<span style="flex:0 0 44px;text-align:center;color:var(--muted);">—</span>`;
      const val = re[f]!=null ? re[f] : '';
      return `<input type="number"${f==='targetDistanceMi'?' step="0.1"':''} style="flex:0 0 44px;" data-target="${f}" data-idx="${idx}" value="${val}">`;
    }).join('')}
    <input type="number" style="flex:0 0 32px;" data-target-time="${idx}:min" value="${totalSec?Math.floor(totalSec/60):''}" placeholder="0">
    <input type="number" style="flex:0 0 32px;" data-target-time="${idx}:sec" value="${totalSec?totalSec%60:''}" placeholder="0">
    <button class="del" data-rm-exercise="${idx}" type="button" style="flex:0 0 16px;">×</button>
  </div>`;
}

let routineBuilderDraft = null; // { id, name, notes, exercises:[...] } while the modal is open
let routineBuilderQuery = '';   // exercise search box text within the modal
let routineBuilderWrap = null;  // the modal's own wrapper element

function renderRoutineBuilderModal(existingRoutine){
  routineBuilderDraft = existingRoutine
    ? JSON.parse(JSON.stringify(existingRoutine))
    : {id: Date.now()+Math.random(), name:'', notes:'', exercises:[], createdAt:Date.now(), updatedAt:Date.now()};
  routineBuilderQuery = '';
  routineBuilderWrap = document.createElement('div');
  document.body.appendChild(routineBuilderWrap);
  renderRoutineBuilderDom();
}
function closeRoutineBuilderModal(){
  if(routineBuilderWrap){ routineBuilderWrap.remove(); routineBuilderWrap = null; }
  routineBuilderDraft = null;
}
function addExerciseToRoutineDraft(exerciseId){
  routineBuilderDraft.exercises.push({exerciseId, order:routineBuilderDraft.exercises.length,
    targetSets:null, targetReps:null, targetWeightLb:null, targetDurationSec:null, targetDistanceMi:null, notes:''});
  routineBuilderQuery = '';
  renderRoutineBuilderDom();
}
function renderRoutineBuilderDom(){
  const draft = routineBuilderDraft;
  const results = getExerciseResults(routineBuilderQuery);
  routineBuilderWrap.innerHTML = `
  <div class="modal-backdrop center">
    <div class="modal">
      ${draft.exercises.length===0 && !draft.name ? '<h2>New Routine</h2>' : ''}
      <div class="field"><label>Name</label><input type="text" id="rb-name" value="${escapeHtml(draft.name)}" placeholder="Leg day"></div>
      <div class="field">
        <label>Add exercise</label>
        <input type="text" id="rb-search" placeholder="Search exercises…" value="${escapeHtml(routineBuilderQuery)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      ${!routineBuilderQuery && results.length ? `<div class="muted" style="margin:6px 0 -2px;">Recent Exercises</div>` : ''}
      <div class="search-list ${results.length?'':'hidden'}" id="rb-results">
        ${results.map((e,i)=>`<div class="search-item" data-idx="${i}" style="display:flex;align-items:center;gap:10px;">${exerciseThumbHtml(e.category)}<div><div class="n">${escapeHtml(e.name)}</div><div class="m">${escapeHtml(e.category)}</div></div></div>`).join('')}
      </div>
      ${routineBuilderQuery && results.length===0 ? `<button class="btn-secondary" id="rb-add-custom" type="button" style="margin-top:6px;">+ Add "${escapeHtml(routineBuilderQuery.trim())}" as custom exercise</button>` : ''}
      ${draft.exercises.length ? (()=>{
        const columns = routineTargetColumns(draft);
        return `<div style="margin-top:14px;">
          <div class="set-table-head">
            <span style="flex:1;text-align:left;">Exercise</span>
            ${columns.map(f=>`<span style="flex:0 0 44px;">${TARGET_FIELD_LABELS[f]}</span>`).join('')}
            <span style="flex:0 0 32px;">MIN</span><span style="flex:0 0 32px;">SEC</span>
            <span style="flex:0 0 16px;"></span>
          </div>
          ${draft.exercises.map((re,i)=>routineExerciseRowHtml(re, i, exerciseById(re.exerciseId), columns)).join('')}
        </div>`;
      })() : `<div class="muted" style="margin-top:10px;">No exercises added yet.</div>`}
      <button class="btn-primary" id="rb-save" style="margin-top:14px;">Save Routine</button>
      <button class="btn-secondary" id="rb-cancel" style="margin-top:8px;">Cancel</button>
    </div>
  </div>`;
  wireRoutineBuilderHandlers();
}
function wireRoutineBuilderHandlers(){
  const wrap = routineBuilderWrap;
  wrap.querySelector('.modal-backdrop').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeRoutineBuilderModal(); });

  const nameInput = wrap.querySelector('#rb-name');
  if(nameInput){
    nameInput.addEventListener('input', ()=>{ routineBuilderDraft.name = nameInput.value; });
  }
  const searchInput = wrap.querySelector('#rb-search');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      routineBuilderQuery = searchInput.value;
      renderRoutineBuilderDom();
      // Re-render replaces the input with a fresh DOM node, which resets the
      // cursor to the start unless explicitly put back at the end — same fix
      // as the main food-search input uses.
      const el = routineBuilderWrap.querySelector('#rb-search');
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }
  const resultsEl = wrap.querySelector('#rb-results');
  if(resultsEl){
    const results = getExerciseResults(routineBuilderQuery);
    resultsEl.querySelectorAll('.search-item').forEach(el=>{
      el.addEventListener('click', ()=>addExerciseToRoutineDraft(results[Number(el.dataset.idx)].id));
    });
  }
  const addCustomBtn = wrap.querySelector('#rb-add-custom');
  if(addCustomBtn) addCustomBtn.addEventListener('click', ()=>{
    const name = routineBuilderQuery.trim(); if(!name) return;
    const id = slugify(name);
    if(!exerciseById(id)) state.myExercises.push({id, name, category:'Other', metricType:'weight_reps', isCustom:true});
    addExerciseToRoutineDraft(id);
  });
  wrap.querySelectorAll('[data-rm-exercise]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      routineBuilderDraft.exercises.splice(Number(btn.dataset.rmExercise),1);
      renderRoutineBuilderDom();
    });
  });
  wrap.querySelectorAll('[data-target]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const idx = Number(inp.dataset.idx);
      const field = inp.dataset.target;
      routineBuilderDraft.exercises[idx][field] = inp.value===''?null:Number(inp.value);
    });
  });
  wrap.querySelectorAll('[data-target-time]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const [idxStr] = inp.dataset.targetTime.split(':');
      const idx = Number(idxStr);
      const row = inp.closest('.set-table-row');
      const min = Number(row.querySelector(`[data-target-time="${idx}:min"]`).value)||0;
      const sec = Number(row.querySelector(`[data-target-time="${idx}:sec"]`).value)||0;
      const total = min*60+sec;
      routineBuilderDraft.exercises[idx].targetDurationSec = total>0 ? total : null;
    });
  });
  const saveBtn = wrap.querySelector('#rb-save');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const name = (routineBuilderDraft.name||'').trim();
    if(!name){ alert('Enter a routine name.'); return; }
    routineBuilderDraft.name = name; // stored raw — escapeHtml() is applied at every render site, not at storage time
    routineBuilderDraft.updatedAt = Date.now();
    const existingIdx = state.routines.findIndex(r=>r.id===routineBuilderDraft.id);
    if(existingIdx>=0) state.routines[existingIdx] = routineBuilderDraft;
    else state.routines.push(routineBuilderDraft);
    saveState();
    closeRoutineBuilderModal();
    render();
  });
  const cancelBtn = wrap.querySelector('#rb-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', closeRoutineBuilderModal);
}
function deleteRoutine(id){
  if(!confirm('Delete this routine?')) return;
  state.routines = state.routines.filter(r=>r.id!==id);
  saveState(); render();
}
// Moves draggedId to sit where targetId currently is — called once at the end
// of a drag gesture (see the ROUTINE TILE REORDER script near the bottom of
// the file), not live during the drag itself.
function reorderRoutines(draggedId, targetId){
  const fromIdx = state.routines.findIndex(r=>r.id===draggedId);
  const toIdx = state.routines.findIndex(r=>r.id===targetId);
  if(fromIdx<0 || toIdx<0 || fromIdx===toIdx) return;
  const [moved] = state.routines.splice(fromIdx,1);
  state.routines.splice(toIdx,0,moved);
  saveState(); render();
}

/* =========================================================
   WORKOUT SCREEN UI — lives inside the Log screen's Activity
   section (see screenLog), not a dedicated tab; a topbar banner on
   every OTHER screen keeps an in-progress session reachable "at any
   time" without needing its own nav-level screen.
   ========================================================= */
// Compact tile per routine (2-up grid) rather than one full-width card each,
// so several routines fit on screen at once — name + a small red "Go!"
// button (easy to associate with "start", per feedback) instead of a
// full-width Start button, and a clamped exercise-list subtitle.
// data-routine-tile is the reorder script's lookup key (see the
// ROUTINE TILE REORDER script) — the ENTIRE tile is the drag surface (press
// and drag to reorder) and also the tap target to open the editor, with the
// "Go!" button and the small "x" delete button as the two explicit
// exceptions (a plain confirm()-gated delete was simpler and more reliable
// than a long-press gesture).
function routineTileHtml(r){
  const exerciseNames = r.exercises.map(re=>{
    const ex = exerciseById(re.exerciseId);
    return ex ? ex.name : re.exerciseId;
  }).join(', ');
  return `<div class="routine-tile" data-routine-tile="${r.id}">
    <button class="routine-delete-btn" data-delete-routine="${r.id}" type="button" title="Delete routine" aria-label="Delete routine">&times;</button>
    <div class="routine-tile-head">
      <button class="routine-go-btn" data-start-routine="${r.id}" type="button" title="Start routine">Go!</button>
      <h4>${escapeHtml(r.name)}</h4>
    </div>
    <div class="sub">${exerciseNames ? escapeHtml(exerciseNames) : 'No exercises yet'}</div>
  </div>`;
}
// Routine tiles only — the merged Quick Start popup (timed general activity
// + manual steps/min/distance entry) is a separate modal (renderQuickStartModal),
// since it's shown regardless of whether any routines exist.
function workoutsQuickCard(){
  if(state.routines.length===0) return '';
  return `<div class="routine-tile-grid">${state.routines.map(routineTileHtml).join('')}</div>`;
}
// Common activity types for a timed Quick Start session (no routine/exercise
// breakdown, just elapsed time — a brisk walk, a bike ride, a yoga class).
// "Other" is a catch-all rather than free text, keeping this a fixed pick
// list like the rest of the app's Log Activity form.
const QUICK_START_TYPES = ['Walking','Indoor Bike','Outdoor Bike','Running','Weight Routine','Pilates/Yoga','Hiking','Swimming','Elliptical','Rowing','Stairmaster','Other'];
// Last 5 picks float to the top of the dropdown, most-recent-first, followed
// by the rest of the fixed list in its normal order — so a repeat choice is

function orderedQuickStartTypes(){

// Which value fields a set row shows, per exercise metricType — shared by the
// live set table here and target-KPI inference elsewhere. Time is NOT part
// of this — every exercise gets an optional time goal regardless of type
// (see liveFieldsForExercise/activeSessionExerciseHtml), so it's handled as
// its own always-present Min/Sec pair rather than a metricType-gated field.
function setFieldsForMetricType(mt){
  if(mt==='weight_reps') return ['weightLb','reps'];
  if(mt==='reps_only') return ['reps'];
  if(mt==='duration') return [];
  if(mt==='distance_duration') return ['distanceMi'];
  if(mt==='weight_distance') return ['weightLb','distanceMi'];
  return ['weightLb','reps'];
}
const LIVE_FIELD_LABELS = {sets:'SETS', reps:'REPS', weightLb:'LBS', distanceMi:'MI'};
const LIVE_FIELD_ORDER = ['sets','reps','weightLb','distanceMi'];
function liveFieldsForExercise(template){
  const mt = template ? template.metricType : 'weight_reps';
  return [...(usesSetsCount(mt) ? ['sets'] : []), ...setFieldsForMetricType(mt)];

// Which value columns to show across the WHOLE table — the union of what
// each individual exercise needs, in one canonical order, so mixed-type
// routines (e.g. a lift plus a plank) still get one shared header instead
// of a different column set forcing a per-exercise header each time.
function liveTargetColumns(s){
  const cols = new Set();
  s.exercises.forEach(ex=>liveFieldsForExercise(exerciseById(ex.exerciseId)).forEach(f=>cols.add(f)));
  return LIVE_FIELD_ORDER.filter(f=>cols.has(f));
}
// One compact row per exercise, not one row per set — a single checkbox
