/* =========================================================
   HEVY CSV IMPORT — brings in a workout_data.csv export. Format
   confirmed against a real export (not just Hevy's own docs): one
   row per SET, workout-level fields repeat across every row of
   that workout, exercise-level fields repeat across every row of
   that exercise, weight/distance column names vary by the
   exporting account's unit setting (weight_lbs/distance_miles or
   weight_kg/distance_km).
   ========================================================= */
// Hand-rolled character-scanning parser rather than split(',') — Hevy quotes
// every field and escapes embedded quotes as "", and description/notes can
// contain literal commas, so a naive split would silently corrupt those rows.
function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){ /* skip — \n (or end of text) follows */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field!=='' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1 || r[0]!=='');
}
const HEVY_MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
// Hevy's export date format is "D MMM YYYY, HH:mm" — day is 1 or 2 digits, NO
// leading zero (confirmed in a real export, e.g. "2 Feb 2026, 20:45") — this
// is NOT ISO 8601, and new Date(string) is not reliable for it cross-browser.
// Parsed as local time (the export carries no timezone), matching how the
// rest of the app already treats dates via isoDate(new Date(...)).
function hevyDateToEpoch(str){
  const m = String(str).trim().match(/^(\d{1,2}) (\w{3}) (\d{4}), (\d{1,2}):(\d{2})$/);
  if(!m) return null;
  const monthIdx = HEVY_MONTHS[m[2]];
  if(monthIdx===undefined) return null;
  return new Date(Number(m[3]), monthIdx, Number(m[1]), Number(m[4]), Number(m[5])).getTime();
}
// Mirrors selectFoodIntoForm's matched-vs-custom decision: exact name match
// (via the same slugify() used for baseline seeding) reuses that id; no match
// creates a state.myExercises entry so an incomplete baseline never causes
// data loss, only a less-populated shared library. metricType is a best
// guess from which fields actually showed up across this exercise's
// imported sets (sampleSets), so the set-entry form defaults sensibly later.
function reconcileImportedExercise(title, sampleSets){
  const id = slugify(title);
  if(exerciseById(id)) return id;
  const has = f => sampleSets.some(s=>s[f]!=null);
  let metricType = 'reps_only';
  if(has('weightLb') && has('distanceMi')) metricType = 'weight_distance';
  else if(has('weightLb')) metricType = 'weight_reps';
  else if(has('distanceMi')) metricType = 'distance_duration';
  else if(has('durationSec')) metricType = 'duration';
  else if(has('reps')) metricType = 'reps_only';
  state.myExercises.push({id, name:title, category:'Other', metricType, isCustom:true});
  return id;
}
// Groups the flat row-per-set CSV into Workout -> Exercise -> Set, matching
// state.days[iso].workouts[] exactly — the data model was built to natively
// match Hevy's own hierarchy specifically so this mapping is close to 1:1
// rather than needing a lossy reshape. Change-detection over successive rows
// (new workout when title+start_time differs from the previous row, new
// exercise when exercise_title differs) rather than a group-by-map, since a
// real export is already contiguous/ordered.
function parseHevyCsv(text){
  const rows = parseCsv(text);
  if(rows.length<2) return [];
  const header = rows[0].map(h=>h.trim());
  const col = name => header.indexOf(name);
  const weightCol = col('weight_lbs')>=0 ? {i:col('weight_lbs'), toLb:v=>v} : {i:col('weight_kg'), toLb:v=>v*2.20462};
  const distCol = col('distance_miles')>=0 ? {i:col('distance_miles'), toMi:v=>v} : {i:col('distance_km'), toMi:v=>v*0.621371};
  const iTitle=col('title'), iStart=col('start_time'), iEnd=col('end_time'), iDesc=col('description'),
    iExTitle=col('exercise_title'), iSuperset=col('superset_id'), iExNotes=col('exercise_notes'),
    iSetType=col('set_type'), iReps=col('reps'), iDuration=col('duration_seconds'), iRpe=col('rpe');
  const num = v => (v===undefined || v===null || v==='') ? null : Number(v);

  const workouts = [];
  let curWorkout=null, curExercise=null, lastWorkoutKey=null;
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(row.length<header.length) continue; // trailing blank line etc.
    const title = row[iTitle], startStr = row[iStart];
    const workoutKey = title+'|'+startStr;
    if(workoutKey!==lastWorkoutKey){
      curWorkout = {
        id: Date.now()+Math.random(),
        importKey: workoutKey, // stable per (title,start) — used only to dedupe on (re-)import, not as the row identity
        title: title || 'Workout', routineId: null,
        startTime: hevyDateToEpoch(startStr), endTime: hevyDateToEpoch(row[iEnd]),
        description: row[iDesc]||'', status: 'completed', pausedAccumMs: 0, exercises: []
      };
      workouts.push(curWorkout);
      lastWorkoutKey = workoutKey; curExercise = null;
    }
    const exTitle = row[iExTitle];
    if(!curExercise || curExercise.exerciseTitle!==exTitle){
      curExercise = {id: Date.now()+Math.random(), exerciseId:null, exerciseTitle:exTitle,
        supersetId: row[iSuperset]||null, notes: row[iExNotes]||'', order: curWorkout.exercises.length, sets:[]};
      curWorkout.exercises.push(curExercise);
    }
    curExercise.sets.push({
      index: curExercise.sets.length,
      setType: row[iSetType]||'normal',
      weightLb: num(row[weightCol.i])!=null ? Math.round(weightCol.toLb(num(row[weightCol.i]))*10)/10 : null,
      reps: num(row[iReps]),
      distanceMi: num(row[distCol.i])!=null ? Math.round(distCol.toMi(num(row[distCol.i]))*100)/100 : null,
      durationSec: num(row[iDuration]),
      rpe: num(row[iRpe]),
      completed: true
    });
  }
  // Resolved after all sets are collected, since metricType inference needs
  // the full set list for each exercise.
  workouts.forEach(w=>w.exercises.forEach(ex=>{ ex.exerciseId = reconcileImportedExercise(ex.exerciseTitle, ex.sets); }));
  // Estimated the same way a live session's is (see estimateWorkoutCalories)
  // — after exerciseId resolution, since metForSession needs each exercise's
  // real metricType, not just its imported title.
  workouts.forEach(w=>{ w.caloriesBurned = estimateWorkoutCalories(w); });
  return workouts;
}
// Hevy's CSV has no separate "routines" concept — what Hevy's own Workout tab
// shows as routine cards is just past sessions grouped by their repeated
// title, with the exercises that were actually done under that name. This
// reproduces that: one routine per distinct workout title not already
// matching an existing routine's name, exercise list built from the union of
// exercises seen across every imported session with that title (first-seen
// order). Target sets/reps/weight are left blank (it's inferred from
// history, not an explicit plan) — same as how the routine builder leaves
// them optional.
function deriveRoutinesFromImportedWorkouts(workouts){
  const byTitle = {};
  workouts.forEach(w=>{ (byTitle[w.title] = byTitle[w.title]||[]).push(w); });
  let created = 0;
  Object.keys(byTitle).forEach(title=>{
    if(state.routines.some(r=>r.name===title)) return;
    const exerciseIds = [];
    byTitle[title].forEach(w=>w.exercises.forEach(ex=>{
      if(!exerciseIds.includes(ex.exerciseId)) exerciseIds.push(ex.exerciseId);
    }));
    if(exerciseIds.length===0) return;
    state.routines.push({
      id: Date.now()+Math.random(), name: title, notes: '',
      exercises: exerciseIds.map((exerciseId,order)=>({exerciseId, order, targetSets:null, targetReps:null, targetWeightLb:null, targetDurationSec:null, targetDistanceMi:null, notes:''})),
      createdAt: Date.now(), updatedAt: Date.now()
    });
    created++;
  });
  return created;
}
// Skips checkGoalsAndCelebrate entirely — this is historical backfill, not
// something happening "now"; celebrating dozens of backdated goal-crossings
// at once in a loop would be a jarring confetti storm, not a welcome-back moment.
async function importHevyCsv(file){
  if(!file) return;
  try{
    const text = await file.text();
    const workouts = parseHevyCsv(text);
    if(workouts.length===0){ showToast('No workouts found in that file.', 'critical'); return; }
    const affectedDays = new Set(workouts.map(w=>isoDate(new Date(w.startTime))));
    if(!confirm(`This will add ${workouts.length} workout${workouts.length===1?'':'s'} across ${affectedDays.size} day${affectedDays.size===1?'':'s'}, and build a routine for each repeated workout name. Continue?`)) return;
    let added=0, skipped=0;
    workouts.forEach(w=>{
      const d = getDay(isoDate(new Date(w.startTime)));
      if(d.workouts.some(existing=>existing.importKey===w.importKey)){ skipped++; return; }
      d.workouts.push(w);
      added++;
    });
    const routinesCreated = deriveRoutinesFromImportedWorkouts(workouts);
    saveState(); render();
    // The import itself is already the kind of deliberate, one-off user gesture
    // "Back up now" requires (see the comment on runAutoBackupDownload for why
    // that's normally manual-only) — folding a fresh backup into it here means
    // the imported workouts are covered the moment they land, instead of only
    // on whatever backup the user happens to take next. Skipped when nothing
    // new was actually added (a re-import of the same file) since there'd be
    // nothing different to capture.
    let backedUp = false;
    if(added>0){ await runAutoBackupDownload(); backedUp = true; }
    showToast(`Imported ${added} workout${added===1?'':'s'}${routinesCreated?`, ${routinesCreated} routine${routinesCreated===1?'':'s'}`:''}${skipped?` (${skipped} workout${skipped===1?'':'s'} already imported)`:''}${backedUp?' — backup saved.':'.'}`, 'good');
  }catch(e){
    showToast('Could not import that file: '+e.message, 'critical');
  }
}

/* =========================================================
   EXERCISE PROGRESS TREND — reuses trendLineChart/openChartTableModal
   exactly as-is (both already generic), same as the app's other charts.
   ========================================================= */
// One point per day this exercise was logged: best-set estimated 1RM (Epley
// formula) for weight-based exercises, total distance/duration for cardio
// types, best reps for bodyweight — capped to the most recent `limit` points,
// matching the 7/12-point precedent of the other trend charts.
function exerciseHistoryPoints(exerciseId, limit){
  const template = exerciseById(exerciseId);
  const mt = template ? template.metricType : 'weight_reps';
  const points = [];
  Object.keys(state.days).sort().forEach(iso=>{
    state.days[iso].workouts.forEach(w=>{
      const ex = w.exercises.find(e=>e.exerciseId===exerciseId);
      if(!ex || ex.sets.length===0) return;
      let value = null;
      if(mt==='weight_reps' || mt==='weight_distance'){
        const oneRms = ex.sets.filter(s=>s.weightLb!=null && s.reps!=null).map(s=>s.weightLb*(1+s.reps/30));
        if(oneRms.length) value = Math.max(...oneRms);
      } else if(mt==='distance_duration'){
        const total = ex.sets.reduce((sum,s)=>sum+(s.distanceMi||0), 0);
        if(total>0) value = total;
      } else if(mt==='duration'){
        const total = ex.sets.reduce((sum,s)=>sum+(s.durationSec||0), 0);
        if(total>0) value = total;
      } else {
        const reps = ex.sets.filter(s=>s.reps!=null).map(s=>s.reps);
        if(reps.length) value = Math.max(...reps);
      }
      if(value!=null) points.push({iso, value: Math.round(value*10)/10});
    });
  });
  return points.slice(-limit);
}
function openExerciseTrendModal(exerciseId){
  const template = exerciseById(exerciseId);
  const name = template ? template.name : exerciseId;
  const mt = template ? template.metricType : 'weight_reps';
  const points = exerciseHistoryPoints(exerciseId, 15);
  if(points.length===0){ showToast('No logged history for this exercise yet.', 'critical'); return; }
  const unit = (mt==='weight_reps'||mt==='weight_distance') ? ' lb (est. 1RM)' : mt==='distance_duration' ? ' mi' : mt==='duration' ? ' sec' : ' reps';
  const labels = points.map(p=>dateFromIso(p.iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}));
  // openInfoModal takes an HTML string, but trendLineChart returns a live SVG
  // node with click listeners already bound to it — appending that node into
  // a placeholder container (rather than serializing to a string) is what
  // keeps those listeners working, same reasoning as mountCharts().
  openInfoModal(name, `<div id="exercise-trend-chart"></div>`);
  const container = document.getElementById('exercise-trend-chart');
  const chart = trendLineChart([{name, color:'var(--blue)', points: points.map(p=>p.value), unit}], labels, {independentScale:true});
  container.appendChild(chart);
  chart.addEventListener('click', ()=>openChartTableModal(name, ['Date', name],
    points.map(p=>[dateFromIso(p.iso).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}), p.value.toLocaleString()+unit]).reverse(),
    [null, 'var(--blue)']
  ));
}

/* =========================================================
   USDA FOODDATA CENTRAL — live food search, supplementing the
   static FOOD_DB above with a much larger, sourced dataset.
   ========================================================= */
function fdcNutrient(f, names){
  const hit = (f.foodNutrients||[]).find(n=>names.includes(n.nutrientName));
  return hit ? (hit.value||0) : 0;
}
function normalizeFdcFood(f){
  const kcal = fdcNutrient(f, ['Energy']);
  if(!kcal) return null; // skip entries with no usable calorie data
  // foodNutrients values are always per 100g/100ml. Branded items also report a real
  // whole-item serving (servingSize/servingSizeUnit + a household description like
  // "1 burger (228g)") — when that's present, expose the food's natural unit as that
  // whole serving instead of the raw 100g basis. Otherwise picking "1" of a piece-based
  // food (matching "Units/pieces") silently computes 1% of a serving's calories,
  // since 1 gets divided by a per-100g "per" meant for weight-based amounts.
  const servingSize = Number(f.servingSize)||0;
  const servingUnit = (f.servingSizeUnit||'').toLowerCase();
  if(servingSize>0 && (servingUnit==='g'||servingUnit==='ml')){
    const ratio = servingSize/100;
    return {
      n: f.description,
      per:1, u: f.householdServingFullText || `serving (${Math.round(servingSize)}${servingUnit})`,
      k: kcal*ratio,
      p: fdcNutrient(f, ['Protein'])*ratio,
      c: fdcNutrient(f, ['Carbohydrate, by difference'])*ratio,
      f: fdcNutrient(f, ['Total lipid (fat)'])*ratio,
      ir: fdcNutrient(f, ['Iron, Fe'])*ratio,
      ca: fdcNutrient(f, ['Calcium, Ca'])*ratio,
      fdc: true
    };
  }
  return {
    n: f.description, per:100, u:'g', k: kcal,
    p: fdcNutrient(f, ['Protein']),
    c: fdcNutrient(f, ['Carbohydrate, by difference']),
    f: fdcNutrient(f, ['Total lipid (fat)']),
    ir: fdcNutrient(f, ['Iron, Fe']),
    ca: fdcNutrient(f, ['Calcium, Ca']),
    fdc: true
  };
}
// dataType is passed in rather than hardcoded so the caller can try the generic
// Foundation/SR Legacy datasets first, then fall back to the 300k-item Branded
// Foods dataset only if that first, more-curated search comes up empty.
async function searchFDC(query, dataType){
  const key = state.settings.fdcApiKey;
  if(!key || query.trim().length<2) return null;
  try{
    const url = `https://api.nal.usda.gov/fdc/v1/foods/search?query=${encodeURIComponent(query)}&api_key=${encodeURIComponent(key)}&dataType=${encodeURIComponent(dataType)}&pageSize=10`;
    const res = await fetch(url);
    if(!res.ok){
      const bodyText = await res.text().catch(()=>'');
      throw new Error(`HTTP ${res.status}: ${bodyText.slice(0,200)}`);
    }
    const data = await res.json();
    return (data.foods||[]).map(normalizeFdcFood).filter(Boolean);
  }catch(e){
    logError('FoodData Central search failed: '+e.message);
    return null;
  }
}
// Open Food Facts was tried as a free, keyless fallback here, but both of its
// public search endpoints turned out unusable from a static browser app: the
// legacy cgi/search.pl endpoint is CORS-enabled but fails outright roughly half
// the time regardless of query or User-Agent (confirmed by repeated testing —
// not something fixable from the client side), and its newer search-a-licious
// API sends no Access-Control-Allow-Origin header at all, so the browser blocks
// it unconditionally. Dropped in favor of the "Search the web" manual fallback.
//
// Tries FDC's generic Foundation/SR Legacy dataset first, then its ~300,000-item
// Branded Foods dataset only if that first, more-curated search comes up empty —
// so a common food never pays the cost of the second round-trip.
async function liveFoodSearchCascade(query){
  if(!state.settings.fdcApiKey) return {results:[], source:null};
  let results = await searchFDC(query, 'Foundation,SR Legacy');
  if(results && results.length) return {results, source:'USDA FoodData Central'};
  results = await searchFDC(query, 'Branded');
  if(results && results.length) return {results, source:'USDA FoodData Central (branded)'};
  return {results:[], source:null};
}
let liveFoodResults = null;      // normalized results for the query below, or null if none yet/failed
let liveFoodSearchQuery = '';    // which query liveFoodResults corresponds to
let liveFoodSearchSource = null; // which tier the results came from, for the heading label
let liveFoodSearchDebounce = null;
let liveFoodSearchLoading = false;
function triggerLiveFoodSearch(query){
  clearTimeout(liveFoodSearchDebounce);
  if(query.trim().length<2){
    liveFoodResults = null; liveFoodSearchQuery = query; liveFoodSearchLoading = false;
    return;
  }
  liveFoodSearchLoading = true;
  liveFoodSearchDebounce = setTimeout(async ()=>{
    const {results, source} = await liveFoodSearchCascade(query);
    liveFoodSearchLoading = false;
    if(logFoodQuery!==query) return; // user moved on to a different search meanwhile
    liveFoodResults = results;
    liveFoodSearchSource = source;
    liveFoodSearchQuery = query;
    render();
    const el = document.getElementById('food-search');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 400);
}

/* =========================================================
   CALCULATIONS: targets & scores
   ========================================================= */
function lbToKg(lb){ return lb*0.453592; }
function inToCm(inch){ return inch*2.54; }

// Mifflin-St Jeor BMR
function bmr(p){
  const kg = lbToKg(p.weightLb), cm = inToCm(p.heightIn);
  const base = 10*kg + 6.25*cm - 5*p.age;
  return p.sex==='male' ? base+5 : base-161;
}
// "Est. calories burned" for the Activity drill-down — the standard MET (Metabolic
// Equivalent of Task) method from the Compendium of Physical Activities (Ainsworth
// et al.): kcal/min = MET x 3.5 x bodyweight(kg) / 200. MET 4.0 approximates brisk/
// moderate activity, matching what "active minutes" from Fitbit/Google Health
// represent (moderate-to-vigorous exertion), so tracked active minutes are
// multiplied by the person's actual body weight rather than a flat per-minute rate.
// Combines all three collected activity metrics into one estimate instead of
// picking whichever single signal is largest:
//  - Base movement calories use the standard walking energy-cost approximation,
//    ~0.57 kcal per lb per mile (ACE/Compendium-of-Physical-Activities derived),
//    preferring measured distance (accounts for stride length) and falling back
//    to a step-count estimate (~0.04 kcal/step at a 68kg reference weight) when
//    no distance is logged.
//  - Active minutes add the calories from elevated intensity ABOVE that base
//    walking pace, using only the incremental MET (moderate-activity MET 4.0
//    minus an assumed baseline walking MET of 2.0) — the full MET value isn't
//    added on top, since the walking that occurred during those same minutes is
//    already counted in the base term; this is what keeps the two from double-
//    counting the same movement.
function estimateCaloriesBurned(p, steps, activeMinutes, distanceMi){
  const weightKg = lbToKg(p.weightLb);
  const baseKcal = (distanceMi||0)>0
    ? distanceMi * p.weightLb * 0.57
    : (steps||0) * weightKg * 0.0006;
  const deltaMET = 2.0;
  const activeExtraKcal = (deltaMET*3.5*weightKg/200) * (activeMinutes||0);
  return Math.round(baseKcal + activeExtraKcal);
}
// The steps/active-minutes/distance-only portion of a day's calorie burn —
// prefers Google Health's own device-reported figure when available (real,
// source-specific data), falling back to the combined estimate above for
// manually-entered days. Split out from caloriesBurnedForDay (which adds
// workoutCaloriesForDay on top) so callers that want the breakdown
// separately — see openActivityModal — can show each term.
function activityOnlyCaloriesForDay(iso){
  const d = getDay(iso);
  if(d.activity.source==='googlehealth' && d.activity.kcal>0) return d.activity.kcal;
  return estimateCaloriesBurned(state.profile, d.activity.steps, d.activity.activeMin, d.activity.distanceMi);
}
// Rough MET (Metabolic Equivalent of Task) values per Quick Start activity
// type, Compendium-of-Physical-Activities ballpark figures — precise pace/
// intensity isn't tracked, so these are deliberately conservative middle-of-
// the-range estimates, editable per session (see estimateWorkoutCalories).
const ACTIVITY_MET = {
  'Walking':3.5, 'Indoor Bike':7, 'Outdoor Bike':8, 'Running':9.8, 'Weight Routine':5,
  'Pilates/Yoga':3, 'Hiking':6, 'Swimming':7, 'Elliptical':5, 'Rowing':7, 'Stairmaster':8, 'Other':4
};
// A routine/imported session has no single Quick Start type — infer a MET
// from what its exercises actually are: mostly cardio-type (distance/
// duration-based) exercises get a cardio MET, otherwise general resistance
// training. Deliberately one MET per whole session rather than per exercise,
// since individual exercises within a session don't have their own tracked
// time segments, only the session's overall duration.
function metForSession(s){
  if(ACTIVITY_MET[s.title]) return ACTIVITY_MET[s.title];
  const types = s.exercises.map(ex=>{ const t = exerciseById(ex.exerciseId); return t ? t.metricType : 'weight_reps'; });
  const cardioCount = types.filter(mt=>mt==='distance_duration'||mt==='duration').length;
  return types.length && cardioCount > types.length/2 ? 6 : 5;
}
// Standard MET formula: kcal = MET x bodyweight(kg) x duration(hours). This
// is the AUTOMATIC estimate — the user can override it (session.caloriesBurnedOverride
// while live, finalized into session.caloriesBurned at finish; see
// finishWorkoutSession/activeWorkoutSessionCard).
function estimateWorkoutCalories(s){
  const p = state.profile; if(!p) return 0;
  return Math.round(metForSession(s) * lbToKg(p.weightLb) * (workoutDurationMs(s)/3600000));
}
function workoutCaloriesForDay(iso){
  return getDay(iso).workouts.reduce((sum,w)=>sum+(w.caloriesBurned||0), 0);
}
// Canonical "calories burned" for a day — activity (steps/minutes/distance)
// plus every completed workout session's own (auto-estimated or
// user-edited) calorie figure. Used both for display and for the
// weight-goal-impact math, so both stay consistent with each other.
function caloriesBurnedForDay(iso){
  return activityOnlyCaloriesForDay(iso) + workoutCaloriesForDay(iso);
}
// Workout minutes are kept OUT of d.activity entirely (see startWorkoutSession)
// because both existing writers of d.activity — the manual Log Activity save
// handler and the Google Health auto-sync — do a full object REPLACE, not a
// merge, so anything written into d.activity.activeMin directly would be
// silently wiped by whichever of those runs next. Instead, workout minutes
// are summed from d.workouts and added in at read time, everywhere the
// Activity goal is checked or displayed.
function workoutActiveMinForDay(iso){
  return getDay(iso).workouts.reduce((sum,w)=>sum+Math.round(workoutDurationMs(w)/60000), 0);
}
function effectiveActiveMin(iso){
  return getDay(iso).activity.activeMin + workoutActiveMinForDay(iso);
}
function weeklyGoalKcalAdjustment(p){
  const sign = p.goalType==='lose' ? -1 : p.goalType==='gain' ? 1 : 0;
  return sign * (p.ratePerWeekLb*3500/7);
}
// The baseline daily calorie target (BMR at sedentary activity, adjusted for the
// weekly weight-change goal) — shown as an editable suggestion at onboarding/Settings
// rather than a silent recalculation, so a saved override always wins over the formula.
// Floor below which calorie restriction is widely cited as needing medical supervision
// (commonly 1,200 kcal for women / 1,500 for men) — without this, an aggressive
// lb/week rate on top of a real BMR can suggest an unsafely low target (e.g. ~2.5
// lb/week for a typical adult male works out to ~650-700 kcal/day with no floor).
function calorieSafetyFloor(p){ return p.sex==='male' ? 1500 : 1200; }
function suggestedCalorieGoal(p){
  const raw = bmr(p)*1.2 + weeklyGoalKcalAdjustment(p);
  return Math.round(Math.max(raw, calorieSafetyFloor(p)));
}
// True when the SAVED daily calorie goal has drifted far enough from what the
// calculator itself would suggest (or dipped below the safety floor) that it
// won't actually track the profile's stated weekly rate — drives the "!" icon
// next to Settings > Profile Preferences' Daily calorie limit. 250 kcal/day is
// roughly the point where the implied rate is off by ~0.5 lb/week, a difference
// worth flagging without nagging over small, deliberate rounding.
function calorieGoalOffTrack(p){
  if(!p.calorieGoal || p.calorieGoal<=0) return false;
  if(p.calorieGoal < calorieSafetyFloor(p)) return true;
  const suggested = suggestedCalorieGoal(p);
  return Math.abs(p.calorieGoal - suggested) >= 250;
}
// One-line version of the formula behind the "!" icon: the stated rate's own
// calculated calorie/day figure, vs. the saved goal, with a one-phrase verdict
// on which direction it's off (harder to sustain vs. too generous to work).
// Kept deliberately terse — this is a quick sanity check, not a report.
function calorieGoalMathText(p){
  const suggested = suggestedCalorieGoal(p);
  const actual = Math.round(p.calorieGoal || suggested);
  if(p.goalType==='maintain'){
    return `Maintain ≈ ${suggested.toLocaleString()} cal p/d. Your ${actual.toLocaleString()} cal p/d goal is off your calculated maintenance level.`;
  }
  const sign = p.goalType==='lose' ? '-' : '+';
  const harder = p.goalType==='lose' ? actual<suggested : actual>suggested;
  const verdict = harder ? 'may be harder to sustain.' : 'may be too generous to hit your goal.';
  return `${sign}${p.ratePerWeekLb} lb/week ≈ ${suggested.toLocaleString()} cal p/d. Your ${actual.toLocaleString()} cal p/d goal ${verdict}`;
}
// Supporting text under the editable daily goal field — the daily number is the
// single source of truth; weekly/monthly are just that number scaled up so the
// user can see the bigger picture without needing separate editable fields.
// This is a hard daily limit — it does not flex with activity (see dailyTargets).
function calorieGoalBreakdownText(dailyGoal, sexForFloorCheck){
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const weekly = Math.round(dailyGoal*7), monthly = Math.round(dailyGoal*daysInMonth);
  let text = `≈ ${weekly.toLocaleString()}/week · ${monthly.toLocaleString()}/month`;
  if(sexForFloorCheck){
    const floor = calorieSafetyFloor({sex:sexForFloorCheck});
    if(dailyGoal>0 && dailyGoal<floor) text += ` — below the commonly-cited ${floor.toLocaleString()} kcal safety floor; consider a less aggressive weekly rate.`;
  }
  return text;
}
// The daily calorie limit is hard: it's exactly what the user set (or the
// suggested fallback) in profile/setup, and does NOT expand with tracked
// activity — burning more calories doesn't buy a bigger intake budget. How
// activity contributed toward the weight goal is still surfaced separately,
// see weightGoalImpact/weightGoalImpactText.
function dailyTargets(p){
  const kcal = Math.round((p.calorieGoal!=null && p.calorieGoal>0) ? p.calorieGoal : suggestedCalorieGoal(p));
  const proteinG = Math.round(lbToKg(p.weightLb)*1.6);
  const proteinKcal = proteinG*4;
  const remaining = Math.max(kcal-proteinKcal, 200);
  const fatG = Math.round(remaining*0.35/9);
  const carbG = Math.round(remaining*0.65/4);
  return {kcal, proteinG, carbG, fatG};
}
function calorieGoalBreakdown(kcal){
  return `${Math.round(kcal).toLocaleString()} goal`;
}
function dayTotals(iso){
  const d = getDay(iso);
  const t = d.foods.reduce((a,f)=>({
    kcal:a.kcal+f.kcal, protein:a.protein+f.protein, carbs:a.carbs+f.carbs, fat:a.fat+f.fat,
    iron:a.iron+(f.iron||0), calcium:a.calcium+(f.calcium||0)
  }), {kcal:0,protein:0,carbs:0,fat:0,iron:0,calcium:0});
  return t;
}
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
// Standard adult RDAs — iron is notably sex-dependent (higher for menstruating women);
// calcium steps up later in life. Simplified age bands rather than full life-stage tables.
function ironRDA(p){ return p.sex==='male' ? 8 : 18; }
function calciumRDA(p){ const olderThreshold = p.sex==='male' ? 71 : 51; return p.age>=olderThreshold ? 1200 : 1000; }
// Calories consumed vs. goal for the week so far (Monday through iso) — the goal
// side is the same hard daily limit multiplied out, since it no longer flexes
// with activity.
function weekCalorieProgress(iso){
  const {start:ws} = weekRange(iso);
  const weekDates = trackedDatesBetween(ws, iso);
  const consumed = weekDates.reduce((sum,d)=>sum+dayTotals(d).kcal, 0);
  const goal = dailyTargets(state.profile).kcal * weekDates.length;
  return {consumed, goal};
}
// Same approach, month-to-date.
function monthCalorieProgress(iso){
  const {start:ms} = monthRange(iso);
  const monthDates = trackedDatesBetween(ms, iso);
  const consumed = monthDates.reduce((sum,d)=>sum+dayTotals(d).kcal, 0);
  const goal = dailyTargets(state.profile).kcal * monthDates.length;
  return {consumed, goal};
}
// Protein/iron/calcium totals for a date range vs. the per-day target summed across
// every date in range (not just logged days), matching weekCalorieProgress's approach
// so an un-logged day pulls the period average down instead of being skipped.
function periodNutrientTotals(dates){
  const p = state.profile;
  const proteinTarget = dailyTargets(p).proteinG;
  const ironTarget = ironRDA(p);
  const calciumTarget = calciumRDA(p);
  let protein=0, iron=0, calcium=0;
  dates.forEach(iso=>{ const t = dayTotals(iso); protein+=t.protein; iron+=t.iron; calcium+=t.calcium; });
  return {
    protein, proteinGoal: proteinTarget*dates.length,
    iron, ironGoal: ironTarget*dates.length,
    calcium, calciumGoal: calciumTarget*dates.length
  };
}
// Actionable, food-specific suggestions for whichever of the three fell short —
// only surfaced for nutrients actually under target, not shown as a checklist regardless.
function nutrientShortfallTips(totals){
  const tips = [];
  if(totals.proteinGoal>0 && totals.protein < totals.proteinGoal*0.9){
    const gap = Math.round(totals.proteinGoal-totals.protein);
    tips.push(`Protein: ${hl(gap+'g')} short > Greek yogurt, eggs, chicken breast.`);
  }
  if(totals.ironGoal>0 && totals.iron < totals.ironGoal*0.9){
    const gap = (totals.ironGoal-totals.iron).toFixed(1);
    tips.push(`Iron: ${hl(gap+'mg')} short > red meat, spinach, lentils.`);
  }
  if(totals.calciumGoal>0 && totals.calcium < totals.calciumGoal*0.9){
    const gap = Math.round(totals.calciumGoal-totals.calcium);
    tips.push(`Calcium: ${hl(gap+'mg')} short > milk, yogurt, leafy greens.`);
  }
  return tips;
}
// Purely informational — the calorie LIMIT itself is hard (baseGoal, see
// dailyTargets) and never widens with activity. This just separately reports
// how much burned-calorie "bonus" would have offset any overeating, so activity
// still visibly counts toward the weight goal even though it can't buy a bigger
// budget. bonusDeficit > 0 = burn covered the day fully with some to spare
// (extra progress); < 0 = ate beyond what even the burn could offset.
function weightGoalImpact(dates){
  const p = state.profile;
  let consumed=0, baseGoal=0, burned=0;
  dates.forEach(iso=>{
    consumed += dayTotals(iso).kcal;
    baseGoal += (p.calorieGoal!=null && p.calorieGoal>0) ? p.calorieGoal : suggestedCalorieGoal(p);
    burned += caloriesBurnedForDay(iso);
  });
  const extraEaten = Math.max(0, consumed-baseGoal);
  return {consumed, baseGoal, burned, bonusDeficit: burned-extraEaten};
}
function weightGoalImpactText(impact, p, periodWord){
  periodWord = periodWord || 'today';
  const burned = Math.round(impact.burned);
  const bonus = Math.round(impact.bonusDeficit);
  if(burned<30) return null; // not enough tracked activity to say anything meaningful yet
  const goalWord = p.goalType==='lose' ? 'weight-loss' : p.goalType==='gain' ? 'weight-gain' : 'maintenance';
  if(Math.abs(bonus)<50){
    return `Activity earned about ${burned.toLocaleString()} extra calories of budget ${periodWord}, and you used just about all of it — right on pace for your ${goalWord} goal.`;
  }
  if(bonus>0){
    const lb = bonus/3500;
    const lbText = lb>=0.05 ? ` (~${lb.toFixed(2)} lb)` : '';
    return `Activity earned about ${burned.toLocaleString()} extra calories of budget ${periodWord}, and ${bonus.toLocaleString()}${lbText} went unused — a bonus push toward your ${goalWord} goal.`;
  }
  const possessive = periodWord==='today' ? "today's" : `${periodWord}'s`;
  return `You ate about ${Math.abs(bonus).toLocaleString()} calories more than even ${possessive} activity-boosted budget — the ${burned.toLocaleString()} calories burned helped, just not quite enough to offset it.`;
}

// Calorie-vs-target scoring, asymmetric by goal direction: lose/gain only penalize
// the "wrong" side of target (eating too little when trying to lose, or too much
// when trying to gain is never penalized), maintain penalizes deviation either way.
// Shared by the single-day and period-aggregate nutrition scores below.
function calorieDirectionScore(goalType, kcalDiff, target){
  if(goalType==='lose') return kcalDiff<=0 ? 100 : clamp(100 - kcalDiff/target*200, 0, 100);
  if(goalType==='gain') return kcalDiff>=0 ? 100 : clamp(100 - (-kcalDiff)/target*200, 0, 100);
  return clamp(100 - Math.abs(kcalDiff)/target*200, 0, 100);
}
// The Nutrition score is calories-in-vs-calories-burned only — protein/iron/calcium
// stay tracked and visible (the Trends nutrient card, shortfall tips) but are
// informational, not scored. Weight loss is the app's primary use case and the
// calorie balance is what actually drives that, so the score stays focused there
// instead of blending in a protein ratio that swings wildly on partial-day data
// (a single low-protein snack could tank the old blended score even on a day
// that was otherwise well within its calorie goal).
function nutritionScore(iso){
  const p = state.profile; if(!p) return null;
  const totals = dayTotals(iso);
  const targets = dailyTargets(p); // hard daily limit — activity doesn't buy score-free allowance
  // Starts at a full 100 (lose/gain: being on the right side of target is fully
  // "correct" no matter how little of the day has happened yet) and only falls
  // once calories actually cross the target — deliberately not scaled by how
  // much of the day/budget has been logged so far, so it reads the same way a
  // typical calorie-budget ring does: full/green until exceeded, not a
  // progressively-earned score.
  return Math.round(calorieDirectionScore(p.goalType, totals.kcal-targets.kcal, targets.kcal));
}
// Same idea as nutritionScore but scored against the period's AGGREGATE calorie
// result rather than averaging each day's own score — so a day that ran slightly
// over doesn't drag down an otherwise-successful week/month as long as the
// period's overall result is still on the right side of goal. Unlogged days are
// excluded entirely (not counted as "ate zero"), matching how avgScore already
// skips days with no food logged.
function aggregateNutritionScore(dates){
  const p = state.profile; if(!p) return null;
  const loggedDates = dates.filter(iso=>getDay(iso).foods.length>0);
  if(loggedDates.length===0) return null;
  let consumed=0, target=0;
  loggedDates.forEach(iso=>{
    consumed += dayTotals(iso).kcal;
    target += dailyTargets(p).kcal;
  });
  return Math.round(calorieDirectionScore(p.goalType, consumed-target, target));
}
function activityScore(iso){
  const p = state.profile; if(!p) return null;
  const d = getDay(iso);
  const activeMin = effectiveActiveMin(iso);
  if(d.activity.steps===0 && activeMin===0) return null; // includes workout-only days as "activity logged"
  const stepPart = clamp(d.activity.steps/p.stepGoal*100, 0, 100);
  const minPart = clamp(activeMin/p.activeMinGoal*100, 0, 100);
  return Math.round(stepPart*0.6 + minPart*0.4);
}
function dayOverallScore(iso){
  // nutritionScore now always returns a number once a profile exists (it starts
  // at 100 and only falls once calories are exceeded — see nutritionScore),
  // so it can no longer be used on its own to detect "nothing logged yet."
  // Gate on the raw logged state instead: stay unscored until food or activity
  // actually has something in it.
  const d = getDay(iso);
  const hasFood = d.foods.length>0;
  const hasActivity = d.activity.steps>0 || effectiveActiveMin(iso)>0;
  if(!hasFood && !hasActivity) return null;
  const n = nutritionScore(iso), a = activityScore(iso);
  if(n===null && a===null) return null;
  if(n===null) return a;
  if(a===null) return n;
  return Math.round(n*0.55 + a*0.45);
}
// Week/month version of dayOverallScore — nutrition uses the period aggregate
// (see aggregateNutritionScore), activity stays a per-day average since only the
// calorie/nutrition side of the goal was asked to work this way.
function periodOverallScore(dates){
  const n = aggregateNutritionScore(dates), a = avgScore(dates, activityScore);
  if(n===null && a===null) return null;
  if(n===null) return a;
  if(a===null) return n;
  return Math.round(n*0.55 + a*0.45);
}
function avgScore(dates, fn){
  const vals = dates.map(fn).filter(v=>v!==null);
  if(vals.length===0) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}

/* =========================================================

   ========================================================= */
// Dismissal is persisted per-day (not just an in-memory flag) so skipping it once
// actually sticks across reloads for the rest of that Sunday — otherwise reopening
// the app later the same day would show it again despite already being dismissed.
// Only the weight itself being logged, or an explicit dismiss, stops it; simply
// reloading/backgrounding the app does not.
function shouldPromptWeighIn(){
  if(!state.profile || !state.settings.weightTrackingEnabled) return false;
  const t = today();
  if(!isSunday(t)) return false;
  const d = getDay(t);
  if(d.weightLb || d.weighInDismissed) return false;
  return true;
}

  const wrap = document.createElement('div');
  wrap.innerHTML = `

// Drill-down table behind a tap on the trend chart's background (a tap on an
// individual point still shows just that point's quick tooltip instead — see
// the chart-mark click handler's stopPropagation in trendLineChart).
// colColors is parallel to columns — a CSS color for that column's cells (matching
// its series' color on the chart above), or falsy to leave a column (e.g. the
// leading Day/Month label) in the default text color.
// editableCol, if given, turns one column into correctable inputs instead of
// plain text: {colIndex, values (raw numbers/null, parallel to rows), unit,
// onSave(rowIndex, newValueOrNull)}. Only offered for columns that map to a
// single stored value per row — a derived/aggregate figure (a score, a sum of
// several food entries) has no one field to write an edit back to, so those
// columns stay plain text.
function openChartTableModal(title, columns, rows, colColors, editableCol){
  colColors = colColors || [];
  const cellStyle = i=>`padding:7px 8px;font-size:13.5px;border-bottom:1px solid var(--grid);white-space:nowrap;${colColors[i]?`color:${colColors[i]};font-weight:700;`:''}`;
  const head = columns.map(c=>`<th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--grid);">${c}</th>`).join('');
  const body = rows.map((r,ri)=>`<tr>${r.map((cell,i)=>{
    if(editableCol && i===editableCol.colIndex){
      const v = editableCol.values[ri];
      return `<td style="${cellStyle(i)}"><input type="number" step="0.1" inputmode="decimal" class="chart-table-edit" data-row="${ri}" value="${v!=null?v:''}" placeholder="--" style="width:64px;background:transparent;border:none;border-bottom:1px dashed var(--muted);color:inherit;font:inherit;font-weight:inherit;padding:2px 0;"></td>`;
    }
    return `<td style="${cellStyle(i)}">${cell}</td>`;
  }).join('')}</tr>`).join('');
  const wrap = openInfoModal(title, `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${editableCol ? `<div class="muted" style="margin-top:8px;">Tap a ${escapeHtml(columns[editableCol.colIndex])} value to correct it.</div>` : ''}`);
  if(editableCol){
    wrap.querySelectorAll('.chart-table-edit').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const ri = Number(inp.dataset.row);
        const raw = inp.value.trim();
        if(raw!==''){
          const n = Number(raw);
          if(isNaN(n) || n<=0){
            showToast('Enter a valid number.', 'critical');
            inp.value = editableCol.values[ri]!=null ? editableCol.values[ri] : '';
            return;
          }
        }
        const v = raw===''? null : Math.round(Number(raw)*10)/10;
        editableCol.onSave(ri, v);
        editableCol.values[ri] = v;
        saveState();
        render();
        showToast('Updated.', 'good');
      });
    });
  }
}

/* =========================================================
   CHART HELPERS (inline SVG, dataviz-skill conventions)
   ========================================================= */
function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
// 7-point line chart, one or two series. series: [{name,color,points:[v...]}]
// opts.independentScale: normalizes each series to its OWN min/max instead of a
// shared 0-100-ish axis — needed when overlaying series with unrelated units
// (e.g. Total Score 0-100 vs Weight in lb), where a shared scale would flatten
// whichever series has the smaller range. Default (falsy) keeps the original
// shared-scale behavior, unaffected, for same-unit series like Activity/Nutrition.
// No vertical-axis scale is drawn — the exact numbers are one tap away via
// the click-through table view (openChartTableModal), and a couple of tick
// labels wasn't pulling its weight on a chart this small.
function trendLineChart(series, labels, opts){
  opts = opts || {};
  const W=320,H=120,padL=6,padR=6,padT=14,padB=20;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const sharedMax = Math.max(100, ...series.flatMap(s=>s.points.filter(v=>v!==null)));
  const scaleFor = s=>{
    if(!opts.independentScale) return {min:0, max:sharedMax};
    const vals = s.points.filter(v=>v!==null);
    if(vals.length===0) return {min:0, max:1};
    const lo = Math.min(...vals), hi = Math.max(...vals);
    return hi>lo ? {min:lo, max:hi} : {min:lo-1, max:hi+1}; // avoid divide-by-zero on a flat line
  };
  const n = labels.length;
  const svg = svgEl('svg',{viewBox:`0 0 ${W} ${H}`});
  svg.appendChild(svgEl('line',{x1:padL,y1:H-padB,x2:W-padR,y2:H-padB,class:'axis-line'}));
  const stepX = n>1 ? plotW/(n-1) : 0;
  series.forEach(s=>{
    const {min,max} = scaleFor(s);
    const pts = [];
    s.points.forEach((v,i)=>{
      if(v===null) return;
      pts.push({i, x: padL + stepX*i, y: H-padB-((v-min)/(max-min))*plotH});
    });
    // Last stretch (whichever plotted point precedes the final one) is drawn as its
    // own dashed/dotted segment when the chart's last point is today — signals that
    // today's number is still accumulating, not a settled final value like every
    // earlier day. Only relevant for the 7-day chart (see opts.dashLastSegment).
    const dashFrom = opts.dashLastSegment && pts.length>=2 && pts[pts.length-1].i===n-1 ? pts.length-2 : -1;
    let d = '';
    for(let k=0;k<pts.length;k++){
      d += (k===0?'M':'L')+pts[k].x+' '+pts[k].y+' ';
      if(k===dashFrom) break; // stop the solid path right before the dashed stretch
    }
    if(d) svg.appendChild(svgEl('path',{d, fill:'none', stroke:s.color,'stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'}));
    if(dashFrom>=0){
      const a = pts[dashFrom], b = pts[dashFrom+1];
      svg.appendChild(svgEl('path',{d:`M${a.x} ${a.y} L${b.x} ${b.y}`, fill:'none', stroke:s.color,'stroke-width':2,'stroke-linecap':'round','stroke-dasharray':'1 6'}));
    }
    s.points.forEach((v,i)=>{
      if(v===null) return;
      const x = padL + stepX*i, y = H-padB-((v-min)/(max-min))*plotH;
      const c = svgEl('circle',{cx:x,cy:y,r:5,fill:s.color,class:'chart-mark'});
      const tipLabel = (opts.tooltipLabels && opts.tooltipLabels[i]) || labels[i];
      c.addEventListener('click', ev=>{ ev.stopPropagation(); showTooltip(ev.clientX, ev.clientY, `${tipLabel} · ${s.name}: ${v.toLocaleString()}${s.unit||''}`); });
      svg.appendChild(c);
    });
  });
  labels.forEach((l,i)=>{
    const x = padL + stepX*i;
    const t = svgEl('text',{x, y:H-6, class:'bar-label','text-anchor':'middle'});
    t.textContent = l;
    svg.appendChild(t);
  });
  return svg;
}
/* =========================================================
   CONFETTI — full-screen celebration when a daily goal is hit.
   Vanilla canvas, no library, so it stays a single self-contained file.
   ========================================================= */
let confettiCanvas=null, confettiCtx=null, confettiRAF=null;
function fireConfetti(){
  if(!confettiCanvas){
    confettiCanvas = document.createElement('canvas');
    confettiCanvas.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;';
    document.body.appendChild(confettiCanvas);
    confettiCtx = confettiCanvas.getContext('2d');
  }
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
  confettiCanvas.style.display = 'block';
  const colors = ['#2a78d6','#1baf7a','#eda100','#008300','#4a3aa7','#e34948','#e87ba4','#eb6834'];
  const particles = Array.from({length:150}, ()=>({
    x: Math.random()*confettiCanvas.width,
    y: -20 - Math.random()*confettiCanvas.height*0.4,
    w: 6+Math.random()*6, h: 8+Math.random()*8,
    color: colors[Math.floor(Math.random()*colors.length)],
    rot: Math.random()*360, rotSpeed: (Math.random()-0.5)*12,
    vy: 2.5+Math.random()*3, vx: (Math.random()-0.5)*2.5
  }));
  const start = Date.now(), duration = 3200;
  if(confettiRAF) cancelAnimationFrame(confettiRAF);
  (function frame(){
    const elapsed = Date.now()-start;
    confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    const fadeAlpha = elapsed>duration-600 ? Math.max(0,(duration-elapsed)/600) : 1;
    particles.forEach(pt=>{
      pt.x+=pt.vx; pt.y+=pt.vy; pt.rot+=pt.rotSpeed; pt.vy+=0.02;
      confettiCtx.save();
      confettiCtx.translate(pt.x, pt.y);
      confettiCtx.rotate(pt.rot*Math.PI/180);
      confettiCtx.fillStyle = pt.color;
      confettiCtx.globalAlpha = fadeAlpha;
      confettiCtx.fillRect(-pt.w/2, -pt.h/2, pt.w, pt.h);
      confettiCtx.restore();
    });
    if(elapsed<duration){
      confettiRAF = requestAnimationFrame(frame);
    } else {
      confettiCanvas.style.display = 'none';
      confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    }
  })();
}
// targetLabel overrides the plain "N unit" text after the slash (e.g. to show a
// calorie goal's activity-bonus breakdown) while still using the numeric target
// for the fill percentage.
function progRow(label, value, target, unit, color, targetLabel){
  const pct = clamp(target>0 ? (value/target*100) : 0, 0, 100);
  const targetText = targetLabel!==undefined ? targetLabel : `${Math.round(target).toLocaleString()}${unit}`;
  return `<div class="prog-row">
    <div class="prog-top"><span class="l">${label}</span><span class="v">${Math.round(value).toLocaleString()}${unit} <span class="muted">/ ${targetText}</span></span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}
// A running pattern-id counter (not just Math.random) so multiple checkered
// rings rendered in the same document — e.g. Total and Activity both complete
// on the same day — never collide on the same <pattern> id.
let checkeredRingId = 0;
function scoreRing(score, size, fixedColor, complete){
  size = size||158;
  const sw = Math.max(6, Math.round(size*0.076));
  const r = size/2-sw, c = size/2;
  const circ = 2*Math.PI*r;
  const val = score===null? 0 : score;
  const color = fixedColor || (val>=80?'var(--good)':val>=60?'var(--yellow)':'var(--critical)');
  // Goal-hit indicator: instead of a glow around the ring, the progress arc
  // itself becomes a checkered-flag pattern (finish-line motif) — the tile
  // size scales with the stroke width so it reads clearly at both the large
  // Total ring and the smaller trio circles.
  let stroke = color, defs = '';
  if(complete){
    const tile = Math.max(4, Math.round(sw*0.7)), half = tile/2;
    const patId = `chk${checkeredRingId++}`;
    defs = `<defs><pattern id="${patId}" width="${tile}" height="${tile}" patternUnits="userSpaceOnUse">
      <rect width="${tile}" height="${tile}" fill="#f2f2f2"/>
      <rect width="${half}" height="${half}" fill="#181818"/>
      <rect x="${half}" y="${half}" width="${half}" height="${half}" fill="#181818"/>
    </pattern></defs>`;
    stroke = `url(#${patId})`;
  }
  return `<svg viewBox="0 0 ${size} ${size}">
    ${defs}
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--grid)" stroke-width="${sw}"
      style="filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${stroke}" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-val/100)}"
      style="filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.28))"/>
  </svg>`;
}
// One consistent ring style at any size, used for the Total/Activity/Nutrition trio —
// number scales with the circle so the small ones stay legible, not cramped.
// displayText is what's shown; pctForRing (0-100, defaults to displayText when it's
// already a plain number like the Total Score) drives the ring fill + color, so
// Activity/Nutrition can show a real value (steps, calories) with a goal-based fill
// instead of a second abstract score.
// `complete` swaps the ring's progress arc to a checkered-flag pattern for a day
// the goal was hit — Total Score and Activity only (checked by callers), never
// Calories/Nutrition.
function scoreCircle(displayText, size, pctForRing, color, complete){
  const pct = pctForRing===undefined ? displayText : pctForRing;
  const numPx = Math.round(size*0.235);
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px;">
    ${scoreRing(pct, size, color, complete)}
    <div class="ring-label">
      <div class="num" style="font-size:${numPx}px;">${displayText===null?'--':displayText}</div>
    </div>
  </div>`;
}
// Abbreviates large counts (steps, calories) so they still fit cleanly in a small ring.
function formatCompact(n){
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return String(Math.round(n));
}

// Tapping a suggestion fills the inline form (Amount/Calories) instead of opening a
// popup — matches the earlier fix for "should stay in the text bar until Enter or a
// suggestion is picked" by keeping everything in one continuous form.
function selectFoodIntoForm(food){
  // Cache FDC results into myFoods on selection so foodMemory/recentFoods (both keyed
  // by name, looked up via allFoods()) keep working for it afterward, and so it's
  // still reachable without a network call if the API key is ever removed.
  if(food.fdc && !state.myFoods.some(f=>f.n===food.n)){
    state.myFoods.push({n:food.n, per:food.per, u:food.u, k:food.k, p:food.p, c:food.c, f:food.f, ir:food.ir, ca:food.ca});
  }
  const priorAmount = Number(foodAmountValue)||0;
  matchedFood = food;
  logFoodQuery = food.n;
  const remembered = state.foodMemory[food.n];
  const amt = priorAmount>0 ? priorAmount : (remembered ? remembered.qty : food.per);
  foodAmountValue = String(amt);
  // Don't auto-fill Calories against the wrong basis when Unit doesn't match this
  // food's own unit — leave it for the user to fill in themselves; the inline
  // warning in screenLog() explains why.
  foodKcalValue = unitMismatch(food) ? '' : String(Math.round(food.k*(amt/food.per)));
  render();
  const amountEl = document.getElementById('food-amount');
  amountEl.focus();
  amountEl.select();
}

/* =========================================================
   GOOGLE HEALTH API (health.googleapis.com) — the platform Google
   moved Fitbit's data onto; the legacy Fitbit Web API is being
   retired Sept 30, 2026. Standard OAuth2 code flow (access_type=
   offline gets a refresh token) so sync runs silently forever
   once connected — no popups, no repeated consent.
   ========================================================= */
const GH_SCOPES = 'openid email '
  + 'https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly '
  + 'https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly';

function ghRedirectUri(){ return location.origin + location.pathname; }

// Decodes the email out of Google's id_token (a JWT) so the app can show which
// Google account actually got connected — the account tied to someone's Fitbit
// is frequently not their everyday/default one, so surfacing it lets a mismatch
// get caught immediately instead of silently syncing the wrong person's data.
function decodeJwtEmail(idToken){
  try{
    const payload = idToken.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(atob(payload).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json).email || null;
  }catch(e){ return null; }
}

async function startGoogleHealthAuth(){
  const {clientId} = state.settings;
  if(!clientId){ alert('Add your Google Client ID first (see Step 2 below the button).'); return; }
  const params = new URLSearchParams({
    client_id: clientId, response_type:'code', redirect_uri: ghRedirectUri(),
    // select_account forces Google's account-chooser screen every single time,
    // even if the browser already has an active Google session — without it,
    // "Reconnect" can silently reuse whatever account is currently signed in
    // instead of letting the person pick the one their Fitbit actually uses.
    scope: GH_SCOPES, access_type:'offline', prompt:'consent select_account', include_granted_scopes:'true'
  });
  // Regular navigation (not location.replace) — replace() turned out to destroy the
  // app's own history entry too (since Google's return redirect collapses into the
  // same slot), so back skipped past the app entirely instead of landing on it. A
  // normal push means back may briefly land on Google's consent page once, which is
  // a smaller problem than back exiting the app altogether.
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
}
async function handleGoogleHealthRedirect(){
  const url = new URL(location.href);
  const code = url.searchParams.get('code');
  if(!code) return;
  history.replaceState({tab:'today', focus:null}, '', ghRedirectUri()); // strip ?code=, keep the tab-history convention consistent
  const {clientId, clientSecret} = state.settings;
  if(!clientId || !clientSecret) return;
  try{
    const body = new URLSearchParams({
      client_id: clientId, client_secret: clientSecret, grant_type:'authorization_code',
      code, redirect_uri: ghRedirectUri()
    });
    const res = await fetch('https://oauth2.googleapis.com/token', {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body
    });
    if(!res.ok){
      const bodyText = await res.text().catch(()=>'');
      throw new Error(`Token exchange HTTP ${res.status}: ${bodyText.slice(0,300)}`);
    }
    const data = await res.json();
    const email = data.id_token ? decodeJwtEmail(data.id_token) : null;
    state.googleHealth = {accessToken:data.access_token, refreshToken:data.refresh_token, expiresAt: Date.now()+data.expires_in*1000, email};
    saveState();
    await fetchGoogleHealthToday(false);
  }catch(e){
    logError('Connect failed: '+e.message);
    alert('Google Health connection failed:\n\n'+e.message+'\n\nMost common causes: the app owner hasn\'t approved your email as a test user yet, or the Client ID/Secret was mistyped when you pasted it in Step 2. Check with the app owner if it keeps failing.');
  }
}
async function ensureGoogleHealthToken(){
  const gh = state.googleHealth;
  if(gh.accessToken && Date.now() < gh.expiresAt-60000) return gh.accessToken;
  if(!gh.refreshToken) return null;
  const body = new URLSearchParams({
    client_id: state.settings.clientId, client_secret: state.settings.clientSecret,
    grant_type:'refresh_token', refresh_token: gh.refreshToken
  });
  const res = await fetch('https://oauth2.googleapis.com/token', {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body
  });
  if(!res.ok) return null;
  const data = await res.json();
  gh.accessToken = data.access_token; gh.expiresAt = Date.now()+data.expires_in*1000;
  if(data.refresh_token) gh.refreshToken = data.refresh_token; // Google doesn't always reissue one
  saveState();
  return gh.accessToken;
}
function extractNumericField(obj, candidates){
  if(!obj) return null;
  for(const key of candidates){
    if(obj[key]!==undefined && obj[key]!==null){ const n=Number(obj[key]); if(!isNaN(n)) return n; }
  }
  return null;
}
// Finds whichever nested field ends in "Sum" (e.g. steps -> countSum, confirmed
// against Google's own reference CLI source) rather than a single hardcoded
// name per data type — resilient to the exact key not being re-checked for
// every type. Values come back as strings ("9037"), hence the Number() call.
function extractRollupSum(rollupPoint){
  if(!rollupPoint) return null;
  for(const key of Object.keys(rollupPoint)){
    if(key==='civilStartTime'||key==='civilEndTime') continue;
    const obj = rollupPoint[key];
    if(obj && typeof obj==='object'){
      const sumKey = Object.keys(obj).find(k=>k.toLowerCase().endsWith('sum'));
      if(sumKey) return Number(obj[sumKey]);
    }
  }
  return null;
}
// The API's CivilDateTime wraps year/month/day in a "date" key — omitting that
// wrapper (sending {year,month,day} directly as the range bound) is what was
// causing the 400 INVALID_DATA_POINT_FILTER_RESTRICTION_COMPARATOR error.
function civilDate(dateIso){
  const d = dateFromIso(dateIso);
  return {date: {year:d.getFullYear(), month:d.getMonth()+1, day:d.getDate()}};
}
// One aggregated total for the whole day, computed server-side — avoids both
// the civil_start_time filter's comparator restrictions and any risk of
// under-counting from un-paginated raw data points.
async function fetchGoogleHealthRollup(dataType, dateIso, token){
  const url = `https://health.googleapis.com/v4/users/me/dataTypes/${dataType}/dataPoints:dailyRollUp`;
  const body = JSON.stringify({
    range: {start: civilDate(dateIso), end: civilDate(addDays(dateIso,1))},
    windowSizeDays: 1
  });
  const res = await fetch(url, {method:'POST', headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}, body});
  if(!res.ok){
    const bodyText = await res.text().catch(()=>'');
    throw new Error(`HTTP ${res.status} for ${dataType}: ${bodyText.slice(0,300)}`);
  }
  const data = await res.json();
  const points = data.rollupDataPoints || [];
  return points.reduce((sum,p)=>sum + (extractRollupSum(p)||0), 0);
}
async function fetchGoogleHealthDataType(dataType, filterField, dateIso, token){
  // civil_start_time only supports >= and < as comparators (no <=), so the upper
  // bound has to be the start of the next day, not 23:59:59 of this one.
  const start = `${dateIso}T00:00:00`, end = `${addDays(dateIso,1)}T00:00:00`;
  const filter = `${filterField}.interval.civil_start_time >= "${start}" AND ${filterField}.interval.civil_start_time < "${end}"`;
  const url = `https://health.googleapis.com/v4/users/me/dataTypes/${dataType}/dataPoints?filter=${encodeURIComponent(filter)}`;
  const res = await fetch(url, {headers:{'Authorization':'Bearer '+token}});
  if(!res.ok){
    const bodyText = await res.text().catch(()=>'');
    throw new Error(`HTTP ${res.status} for ${dataType}: ${bodyText.slice(0,300)}`);
  }
  const data = await res.json();
  return data.dataPoints || data.dataPoint || [];
}
async function fetchGoogleHealthToday(silent){
  const token = await ensureGoogleHealthToken();
  if(!token){ if(!silent) alert('Not connected to Google Health yet — tap "Connect & sync today" first.'); return; }
  const t = today();
  try{
    const [steps, activeMin, kcal, distanceMm] = await Promise.all([
      fetchGoogleHealthRollup('steps', t, token),
      fetchGoogleHealthRollup('active-zone-minutes', t, token).catch(()=>0),
      fetchGoogleHealthRollup('active-energy-burned', t, token).catch(()=>0),
      fetchGoogleHealthRollup('distance', t, token).catch(()=>0) // returned in millimeters, per Google's field docs
    ]);
    const d = getDay(t);
    d.activity = {
      steps: Math.round(steps), activeMin: Math.round(activeMin), kcal: Math.round(kcal),
      distanceMi: Math.round((distanceMm/1609340)*10)/10, source:'googlehealth'
    };

    try{
      const weightPoints = await fetchGoogleHealthDataType('weight', 'weight', t, token);
      if(weightPoints.length && !d.weightLb){
        const last = weightPoints[weightPoints.length-1];
        // Google's field is weightGrams — grams, not kilograms.
        const grams = extractNumericField(last.weight||last, ['weightGrams','massGrams','grams','value']);
        if(grams) d.weightLb = Math.round((grams/453.592)*10)/10;
      }
    }catch(e){ /* weight scope/data may not be available yet — activity sync still succeeds */ }

    state.googleHealth.lastSyncAt = Date.now();
    saveState();
    // Skip the re-render if the user is actively typing (e.g. the food search box) —
    // this silent background sync was replacing that input's DOM node mid-keystroke,
    // which read as the field "timing out"/losing what was just typed. State is still
    // saved either way; the UI catches up on the next natural render.
    if(!isUserTyping()) render();
    checkGoalsAndCelebrate(t);
    // No success alert — the infographics/drill-downs just refresh in place via render().
  }catch(e){
    console.error('Google Health sync failed:', e);
    logError('Sync failed: '+e.message);
    if(!silent) alert('Could not fetch Google Health data:\n\n'+e.message+'\n\nManual entry on the Log tab still works.');
  }
}
// Only counts genuine text-entry fields — NOT every focused INPUT. A hidden
// file-picker input (e.g. Hevy import, Fitbit-adjacent flows) can end up as
// document.activeElement after its native picker is opened and then cancelled
// (no 'change' event fires to move focus elsewhere), which would otherwise
// make this report "typing" forever and silently block checkForUpdate()'s
// reload — including pull-to-refresh — from ever firing again.
function isUserTyping(){
  const el = document.activeElement;
  if(!el) return false;
  if(el.tagName==='TEXTAREA') return true;
  if(el.tagName!=='INPUT') return false;
  return ['text','number','email','tel','search','password','url','date','time'].includes(el.type);
}
let lastGHAutoSync = 0;
// Deliberately short — this is called from render(), which fires after essentially every
// app action (tab switch, food add/remove, activity edit, keystroke in search), so the app
// feels continuously live rather than needing a manual "refresh" tap. The floor only exists
// to stop rapid-fire renders (e.g. fast typing) from hammering the API.
const GH_AUTOSYNC_GAP_MS = 8*1000;
async function autoSyncGoogleHealthIfDue(){
  if(!state.googleHealth.refreshToken) return;
  if(Date.now()-lastGHAutoSync < GH_AUTOSYNC_GAP_MS) return;
  lastGHAutoSync = Date.now();
  await fetchGoogleHealthToday(true);
}
// Label for the "Fitbit sync" readout in the Today card's top-right corner — Fitbit's
// own data lives on Google Health now (see the block above), so this reads the same
// connection/timestamp state the auto-sync uses.
function fitbitSyncLabel(){
  const gh = state.googleHealth;
  if(!gh.refreshToken) return 'Fitbit not connected';
  if(!gh.lastSyncAt) return 'Fitbit sync pending…';
  const d = new Date(gh.lastSyncAt);
  const time = d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  const sameDay = d.toDateString()===new Date().toDateString();
  return `Fitbit sync ${sameDay ? time : d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+', '+time}`;
}

function mountCharts(){
  // Steps/Active-min/Distance/Calories/Protein no longer render as charts anywhere —
  // openActivityModal/openNutritionModal show large readable numbers instead.
  // This only needs to handle History's trend chart.
  const t = today();
  const trendEl = document.getElementById('chart-trend');
  if(!trendEl) return;
  trendEl.style.cursor = 'pointer';
  if(historyMode==='month'){
    // Rolling 12-month view, one point per calendar month (not day-of-month) —
    // matches the "Monthly Trends" title as an actual month-over-month trend.
    // Labels are single letters (JFMAMJJASOND convention); January points (and
    // the very first point) also carry a 2-digit year so a 12-month window
    // crossing a year boundary stays unambiguous.
    const buckets = trailingMonthBuckets(12, t);
    const bucketDates = buckets.map(b=>trackedDatesBetween(b.start,b.end));
    const scorePoints = buckets.map((b,i)=>periodOverallScore(bucketDates[i]));
    // Which day each bucket's weight actually came from — needed so an edit in
    // the table below can be written back to that specific day, not just the
    // aggregated month value. Buckets with nothing logged yet fall back to their
    // last tracked day, so entering a weight there for the first time has
    // somewhere sensible to land.
    const weightDates = bucketDates.map((ds,i)=> latestWeightDateIn(ds) || ds[ds.length-1] || buckets[i].end);
    const weightPoints = bucketDates.map(ds=>latestWeightIn(ds));
    const labels = buckets.map((b,i)=>{
      const letter = MONTH_LETTERS[b.monthIdx];
      return (i===0 || b.monthIdx===0) ? `${letter}${String(b.year).slice(-2)}` : letter;
    });
    const tooltipLabels = buckets.map(b=>new Date(b.year,b.monthIdx,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}));
    // Total Score and Weight are unrelated units (0-100 vs lb), so this chart
    // needs independent per-series scaling — see trendLineChart's opts.
    trendEl.appendChild(trendLineChart([
      {name:'Total Score', color:'var(--blue)', points: scorePoints},
      {name:'Weight', color:'var(--orange)', points: weightPoints}
    ], labels, {independentScale:true, tooltipLabels}));
    trendEl.addEventListener('click', ()=>{
      // Reversed to most-recent-first for the table — the chart itself stays
      // chronological (oldest-to-newest, left-to-right) since that's how a trend line reads.
      // weightDates/weightPoints are reversed in lockstep so a table row's edit
      // always lands on the right day regardless of display order.
      const rows = buckets.map((b,i)=>[tooltipLabels[i], scorePoints[i]===null?'--':scorePoints[i], weightPoints[i]===null?'--':weightPoints[i].toFixed(1)+' lb']).reverse();
      const datesRev = weightDates.slice().reverse();
      const valuesRev = weightPoints.slice().reverse();
      openChartTableModal('Monthly Trends', ['Month','Total Score','Weight'], rows,
        [null,'var(--blue)','var(--orange)'],
        { colIndex:2, values: valuesRev, unit:' lb', onSave:(ri, newVal)=>{ getDay(datesRev[ri]).weightLb = newVal; } }
      );
    });
  }else{
    const dates = []; for(let i=6;i>=0;i--) dates.push(addDays(t,-i));
    const labels = dates.map(d=>dateFromIso(d).toLocaleDateString(undefined,{weekday:'short'}).slice(0,2));
    // Actual kcal in/out rather than the 0-100 Activity/Nutrition scores: a
    // score flattens to 100 the moment a goal's met (eating well under the
    // calorie limit, or blowing past step/active-min goals, both just read
    // as "100"), which hides exactly the swings someone would want to see
    // on a trend chart. Same null-when-unlogged behavior as the scores had
    // (a day with nothing logged is a gap in the line, not a literal 0).
    const calBurnedPoints = dates.map(d=>{
      const a = getDay(d).activity;
      return (a.steps===0 && a.activeMin===0) ? null : Math.round(caloriesBurnedForDay(d));
    });
    const calInPoints = dates.map(d=> getDay(d).foods.length===0 ? null : Math.round(dayTotals(d).kcal));
    trendEl.appendChild(trendLineChart([
      {name:'Calories Burned', color:'var(--critical)', points: calBurnedPoints, unit:' kcal'},
      {name:'Calories In', color:'var(--good)', points: calInPoints, unit:' kcal'}
    ], labels, {dashLastSegment:true}));
    trendEl.addEventListener('click', ()=>openChartTableModal('7-day trend', ['Day','Calories Burned','Calories In'],
      dates.map((d,i)=>[dateFromIso(d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}), calBurnedPoints[i]===null?'--':calBurnedPoints[i].toLocaleString()+' kcal', calInPoints[i]===null?'--':calInPoints[i].toLocaleString()+' kcal']),
      [null,'var(--critical)','var(--good)']
    ));
  }
}
