  });
  const clearErrorsBtn = document.getElementById('s-clear-errors');
  if(clearErrorsBtn) clearErrorsBtn.addEventListener('click', e=>{
    e.preventDefault(); // stays inside a <summary> — don't also toggle the fold
    state.errorLog = []; saveState(); render();
  });
  const installBtn = document.getElementById('s-install');
  // Guarded by isInstalled() in installTopbarBtnHtml() too (button renders
  // disabled), but re-checking here means a leftover click from just before
  // installing can't slip through into a second prompt.
  if(installBtn) installBtn.addEventListener('click', async ()=>{
    if(isInstalled()) return;
    if(deferredInstallPrompt){
      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null; // one-shot — the browser invalidates it after a single use either way
      promptEvent.prompt();
      const choice = await promptEvent.userChoice;
      if(choice.outcome==='accepted'){
        state.settings.installPromptAccepted = true;
        saveState();
        showToast('Installed — look for it on your Home Screen.', 'good');
      }
      render();
    } else {
      // No captured browser-native prompt — either this browser doesn't
      // support triggering install from a page at all (iOS Safari, plain
      // Firefox), or Chrome/Edge just hasn't fired beforeinstallprompt yet
      // (it can take a few visits). Either way, the manual path always works.
      // There's no signal a page can detect for "user actually finished the
      // manual steps", so this can't flip the button to Installed on its own
      // — only relaunching from the real Home Screen icon can do that.
      openInfoModal('Install on Home Screen', `
        A bookmarked tab sits below the bar browsers use to decide a site's data is worth protecting from cleanup — installing is the single biggest thing that reduces the odds of your data disappearing on its own between opens. (Separate from "Back up now" below, which only covers you deliberately clearing your browser's history — nothing can protect against that one.)<br><br>
        <strong>iPhone/iPad (Safari):</strong> tap the Share icon (square with an arrow), then "Add to Home Screen".<br><br>
        <strong>Android (Chrome), if this button didn't just install it directly:</strong> tap the ⋮ menu in the top right, then "Add to Home Screen" or "Install app".<br><br>
        <strong>Desktop Chrome/Edge:</strong> look for an install icon at the right edge of the address bar, or use the ⋮ menu → "Install Health Score".
      `);
    }
  });
  const backupNowBtn = document.getElementById('s-backup-now');
  // Awaited so the toast can't claim "saved" before a first-time
  // save-location picker (on browsers that support it) has actually been
  // responded to. This is the ONLY thing that triggers a Downloads-folder
  // export now — see the big comment above runAutoBackupDownload().
  if(backupNowBtn) backupNowBtn.addEventListener('click', async ()=>{
    await runAutoBackupDownload();
    showToast('Backup saved.', 'good');
  });
  const resetBtn = document.getElementById('s-reset');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    if(confirm('This will erase all Health Score data on this device. Continue?')){
      localStorage.removeItem(STORE_KEY); state = defaultState(); render();
    }
  });
  // Settings cards (and nested .subcard sections within Data) fold by default;
  // one that's been manually opened stays open across the re-renders every
  // save/toggle action triggers, since render() otherwise wipes and rebuilds
  // this whole screen from scratch.
  document.querySelectorAll('#app details.card[data-card-key], #app details.subcard[data-card-key]').forEach(d=>{
    d.addEventListener('toggle', ()=>{
      const key = d.dataset.cardKey;
      if(d.open) openSettingsCards.add(key); else openSettingsCards.delete(key);
    });
  });
}

history.replaceState({tab:'today', focus:null}, ''); // baseline entry so later tab switches have something to push atop
render();
handleGoogleHealthRedirect();
// Confetti plays here, on the next fresh page load after a goal was hit — not at
// the moment it's crossed mid-interaction (see checkGoalsAndCelebrate) — so it
// reads as a "welcome back, you did it" moment rather than popping up over
// whatever else was on screen right as the last food/activity got logged.
if(state.pendingCelebration){
  state.pendingCelebration = false;
  saveState();
  fireConfetti();
}
// sw.js is registered further down purely to make the site properly
// installable (for storage-durability purposes, see the persist() block
// below) — it deliberately caches nothing, so a phone that already has the
// page open (installed as a home-screen app or just left in a background
// tab) still won't re-fetch anything on its own just by switching back to an
// already-open tab/webview. A no-store HEAD request bypasses both the
// browser's HTTP cache and GitHub Pages' CDN cache (Cache-Control: max-age=600)
// to always see the truly-latest deploy, so a push shows up next time the app
// is reopened, without anyone needing to know to manually refresh. Skips the
// reload while a field is focused so an update never clobbers whatever's
// mid-typing; localStorage data itself is untouched by a reload either way,
// since every change is already saved as it happens (see saveState() calls
// throughout).
let deployedVersionTag = null;
// Returns a status string so callers that want feedback (pull-to-refresh) can
// react — existing callers (the interval below, visibilitychange) just ignore it.
async function checkForUpdate(){
  try{
    const res = await fetch(location.pathname+'?_='+Date.now(), {cache:'no-store', method:'HEAD'});
    const tag = res.headers.get('etag') || res.headers.get('last-modified');
    if(!tag) return 'unknown';
    if(deployedVersionTag===null){ deployedVersionTag = tag; return 'up-to-date'; } // first check just records the baseline
    if(tag===deployedVersionTag) return 'up-to-date';
    if(isUserTyping()) return 'deferred'; // try again next check instead of interrupting active input
    location.reload();
    return 'reloading';
  }catch(e){ return 'offline'; } // offline or blocked — silently skip, next successful check catches up
}
checkForUpdate();
// "visibilitychange" (not beforeunload) is the reliable close/backgrounding signal on
// mobile, where a PWA is far more often backgrounded/swiped away than formally
// "unloaded" — this covers the "sync on close" half of open+close syncing, alongside
// the sync render() already fires on open and on every subsequent app action.
// Deliberately does NOT also trigger runAutoBackupDownload() anymore — see the
// big comment above that function for why the Downloads-folder export is
// manual-only now (Back up now) rather than something that fires on its own.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){ autoSyncGoogleHealthIfDue(); }
  if(document.visibilityState==='visible') checkForUpdate();
});
// Registering a (deliberately no-op/no-cache, see sw.js) service worker is
// what lets Chrome on Android offer a real "Install app" rather than a plain
// bookmark shortcut — installed apps get Chrome's strongest guarantee against
// silently evicting a site's storage under disk pressure, which is the most
// likely cause of data disappearing on an ordinary close/reopen (as opposed
// to the user deliberately clearing history — no web API can opt out of that
// one, install or not).
if(navigator.serviceWorker && navigator.serviceWorker.register) navigator.serviceWorker.register('sw.js').catch(()=>{});
// True once actually running as the installed/home-screen app rather than a
// regular browser tab — display-mode covers Chrome/Edge/Android,
// navigator.standalone is Safari's own (non-standard, iOS-only) equivalent.
function isStandaloneApp(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
// What the topbar button actually checks — see the settings.installPromptAccepted
// comment in defaultState() for why this isn't just isStandaloneApp() alone.
function isInstalled(){
  return isStandaloneApp() || state.settings.installPromptAccepted;
}
// Chrome/Edge/Android fire this instead of installing immediately, handing
// over an event whose .prompt() shows the native install UI on demand — so
// it has to be captured up front (page load) and held onto until the user
// actually taps the topbar Install button, which is the only place it's
// used. preventDefault() stops the browser's own separate install
// mini-infobar so this button is the one path in, avoiding two different
// install prompts fighting for attention. Re-renders so the button's
// label/state updates live rather than only after switching tabs — this can
// fire well after initial page load.
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  render();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  state.settings.installPromptAccepted = true;
  saveState();
  render();
});
// Best-effort ask not to auto-evict this site's storage under low-disk
// pressure. Chrome auto-grants/denies this based on its own heuristics (site
// engagement, bookmarked, installed) with no user-visible prompt — this code
// can't force a grant, only ask and then check what actually happened.
// Logged (not just swallowed) specifically because there's no way to test
// eviction behavior on someone else's actual phone from here — if data keeps
// vanishing on ordinary close/reopen, Settings > Error log is the place to
// see whether the browser is actually granting persistence, rather than
// continuing to guess.
(async function checkStoragePersistence(){
  if(!(navigator.storage && navigator.storage.persist)) return;
  try{
    let persisted = await (navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(false));
    if(!persisted) persisted = await navigator.storage.persist();
    if(!persisted){
      let detail = '';
      try{
        const est = await navigator.storage.estimate();
        if(est && est.quota) detail = ` (using ~${Math.round((est.usage||0)/1048576)}MB of ~${Math.round(est.quota/1048576)}MB available to this browser)`;
      }catch(e){}
      logError(`Storage is NOT persisted${detail} — this browser may silently evict Health Score's data under storage pressure, even without you clearing history. Try Add to Home Screen / Install app for the strongest protection.`);
    }
  }catch(e){ /* best effort */ }
})();

/* =========================================================
   PULL-TO-REFRESH — forces an update check on demand instead of
   waiting for backgrounding/foregrounding to trigger one. Only
   activates when scrolled to the very top (mirrors native
   pull-to-refresh) and not while a modal is open, so it doesn't
   fight with normal scrolling or onboarding/info-modal gestures.
   ========================================================= */
(function(){
  const indicator = document.getElementById('pull-refresh');
  const THRESHOLD = 70;
  let startY = null, dragging = false, ready = false;
  document.addEventListener('touchstart', e=>{
    if(window.scrollY===0 && !document.querySelector('.modal-backdrop')){
      startY = e.touches[0].clientY;
      dragging = true; ready = false;
      indicator.classList.remove('hidden');
      indicator.classList.add('dragging');
    }
  }, {passive:true});
  document.addEventListener('touchmove', e=>{
    if(!dragging || startY===null) return;
    const dy = e.touches[0].clientY - startY;
    if(dy>0 && window.scrollY===0){
      const dist = Math.min(dy, THRESHOLD*1.6);
      ready = dy>THRESHOLD;
      indicator.style.transform = `translate(-50%, ${dist-60}px)`;
      indicator.classList.toggle('ready', ready);
    }
  }, {passive:true});
  document.addEventListener('touchend', async ()=>{
    if(!dragging) return;
    dragging = false;
    indicator.classList.remove('dragging');
    if(!ready){
      indicator.classList.remove('ready');
      indicator.style.transform = '';
      indicator.classList.add('hidden');
      startY = null;
      return;
    }
    indicator.classList.remove('ready');
    indicator.classList.add('spinning');
    indicator.style.transform = 'translate(-50%, 10px)';
    const status = await checkForUpdate();
    if(status!=='reloading'){ // otherwise the page is already navigating away
      indicator.classList.remove('spinning');
      indicator.style.transform = '';
      indicator.classList.add('hidden');
    }
    startY = null;
  });
})();

/* =========================================================
   ROUTINE TILE REORDER — the whole tile is the drag surface (except the
   "Go!" and "x" delete buttons, excluded by touchstart's closest() check).
   Mirrors the pull-to-refresh gesture above: direct style/class changes
   during the drag itself (no render(), so it stays smooth and doesn't
   fight the gesture mid-motion), one committed reorderRoutines() + render()
   at touchend. Since the drag zone is now the entire card — not a small
   grip icon — a small movement threshold gates when a touch actually
   becomes a drag (only then do we add the .dragging "picked up" feedback
   and preventDefault()), so an ordinary vertical swipe to scroll the page
   over a tile still scrolls normally instead of being hijacked.
   ========================================================= */
(function(){
  const DRAG_THRESHOLD = 10;
  let candidateId = null, candidateEl = null, startX = 0, startY = 0;
  let draggingId = null, draggingEl = null, dropTargetEl = null, isDragging = false;
  document.addEventListener('touchstart', e=>{
    if(e.target.closest('[data-start-routine], [data-delete-routine]')) return;
    const tile = e.target.closest('.routine-tile');
    if(!tile) return;
    candidateId = Number(tile.dataset.routineTile);
    candidateEl = tile;
    const touch = e.touches[0];
    startX = touch.clientX; startY = touch.clientY;
    isDragging = false;
  }, {passive:true});
  document.addEventListener('touchmove', e=>{
    if(!candidateEl) return;
    const touch = e.touches[0];
    const dx = touch.clientX-startX, dy = touch.clientY-startY;
    if(!isDragging){
      if(Math.hypot(dx,dy) < DRAG_THRESHOLD) return;
      isDragging = true;
      draggingId = candidateId; draggingEl = candidateEl;
      draggingEl.classList.add('dragging');
    }
    e.preventDefault();
    draggingEl.style.transform = `translate(${dx}px, ${dy}px)`;
    if(dropTargetEl) dropTargetEl.classList.remove('drop-target');
    const under = document.elementFromPoint(touch.clientX, touch.clientY);
    const overTile = under && under.closest('.routine-tile');
    dropTargetEl = (overTile && overTile!==draggingEl) ? overTile : null;
    if(dropTargetEl) dropTargetEl.classList.add('drop-target');
  }, {passive:false});
  document.addEventListener('touchend', ()=>{
    if(draggingEl){
      draggingEl.classList.remove('dragging');
      draggingEl.style.transform = '';
      if(dropTargetEl){
        dropTargetEl.classList.remove('drop-target');
        reorderRoutines(draggingId, Number(dropTargetEl.dataset.routineTile));
      }
    }
    candidateId = null; candidateEl = null; draggingId = null; draggingEl = null; dropTargetEl = null; isDragging = false;
  });
})();
</script>
</body>
</html>
